<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="課程追蹤">
<meta name="theme-color" content="#f5f4ed">
<title>課程進度追蹤</title>
<style>
:root{
  --bg:#f5f4ed;--surface:#faf9f5;--card:#ffffff;
  --border:#e8e6dc;--border-lt:#f0eee6;
  --text:#141413;--text-2:#5e5d59;--text-3:#87867f;
  --accent:#c96442;
  --sand:#eeece5;--done-bg:#f0f4ef;--done-c:#5a7a5a;
  --warn-bg:#fdf3e8;--warn-c:#a0722a;
  --danger-bg:#fde8e8;--danger-c:#b53333;
  --r-sm:8px;--r:12px;
  --shadow:0 1px 4px rgba(20,14,8,.07),0 0 0 1px rgba(20,14,8,.05);
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --nav-h:52px;--bot-h:62px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}

/* ── Header ── */
.app-header{
  height:var(--nav-h);border-bottom:1px solid var(--border);
  background:rgba(245,244,237,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  position:relative;z-index:20;display:flex;flex-direction:column;flex-shrink:0;
}
.header-row{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
.app-header h1{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:-.2px;}
.header-actions{display:flex;gap:6px;align-items:center;}
.global-pct{font-size:11px;color:var(--text-3);}
.global-pct b{color:var(--accent);font-weight:600;}
.progress-track{height:3px;background:var(--border-lt);}
.progress-track-fill{height:100%;background:var(--accent);transition:width .6s;}

/* ── App shell ── */
.app-shell{display:flex;flex-direction:column;height:calc(100vh - var(--nav-h));}
.layout{display:grid;grid-template-columns:268px 1fr 268px;flex:1;overflow:hidden;}

/* ── Panels ── */
.panel{overflow-y:auto;padding:14px 13px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.panel::-webkit-scrollbar{width:4px;}
.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.panel-l{border-right:1px solid var(--border);}
.panel-r{border-left:1px solid var(--border);}
.section{margin-bottom:18px;}
.section-label{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;}

/* ── Bottom nav (mobile only) ── */
.bottom-nav{display:none;}

/* ── Form ── */
.form-group{margin-bottom:6px;}
.form-label{font-size:11px;color:var(--text-3);margin-bottom:3px;}
input[type=text],input[type=number],input[type=date],select{
  font-family:var(--sans);font-size:13px;width:100%;
  padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--card);color:var(--text);outline:none;transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
input::placeholder{color:var(--text-3);}
input:focus,select:focus{border-color:var(--accent);}
.form-row{display:flex;gap:6px;}
.btn{
  font-family:var(--sans);font-size:13px;font-weight:500;
  padding:8px 14px;border:none;border-radius:var(--r-sm);
  cursor:pointer;transition:opacity .15s,background .15s;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.88;}
.btn-sand{background:var(--sand);color:var(--text-2);}
.btn-sand:hover{background:var(--border);}
.btn-xs{font-size:11px;padding:5px 10px;}

/* ── Weekday CBs ── */
.wday-wrap{display:flex;gap:3px;margin-bottom:7px;flex-wrap:wrap;}
.wday-cb{display:none;}
.wday-label{
  width:30px;height:30px;border-radius:50%;background:var(--sand);color:var(--text-2);
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;user-select:none;
}
.wday-cb:checked+.wday-label{background:var(--accent);color:#fff;}

/* ── Course card ── */
.course-card{background:var(--card);border:1px solid var(--border-lt);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:6px;}
.course-head{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.course-name{font-size:13px;font-weight:600;flex:1;}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:17px;line-height:1;padding:2px;}
.del-btn:hover{color:var(--danger-c);}
.exam-edit-row{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
.exam-edit-lbl{font-size:11px;color:var(--text-3);flex-shrink:0;}
.exam-edit-row input[type=date]{font-size:11px;padding:3px 7px;border-radius:5px;flex:1;}
.exam-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;margin-bottom:4px;}
.exam-badge.ok{background:#e8f0e8;color:var(--done-c);}
.exam-badge.warn{background:var(--warn-bg);color:var(--warn-c);}
.exam-badge.danger{background:var(--danger-bg);color:var(--danger-c);}
.course-meta{font-size:11px;color:var(--text-3);margin-bottom:5px;}
.progress-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;transition:width .5s;}

/* ── Todo ── */
.todo-card{
  display:flex;align-items:center;gap:9px;
  background:var(--card);border:1px solid var(--border-lt);
  border-radius:var(--r-sm);padding:10px 11px;margin-bottom:6px;
  cursor:grab;user-select:none;transition:box-shadow .15s,border-color .15s;
}
.todo-card:hover{box-shadow:var(--shadow);border-color:var(--border);}
.todo-card.dragging{opacity:.2;cursor:grabbing;}
.todo-card.tap-selected{border-color:var(--accent);background:#fff9f7;box-shadow:0 0 0 2px rgba(201,100,66,.2);}
.todo-info{flex:1;}
.todo-name{font-size:13px;font-weight:600;}
.todo-rem{font-size:11px;color:var(--text-3);}
.drag-icon{font-size:14px;color:var(--text-3);}
.muted{font-size:12px;color:var(--text-3);text-align:center;padding:12px 0;}
/* Mobile tap hint */
.tap-hint{font-size:11px;color:var(--accent);text-align:center;padding:4px 8px;margin-bottom:8px;background:rgba(201,100,66,.07);border-radius:6px;display:none;}

/* ── Drag ghost ── */
#drag-ghost{
  position:fixed;pointer-events:none;z-index:9999;
  background:var(--card);border:1.5px solid var(--accent);
  border-radius:var(--r-sm);padding:6px 13px 6px 10px;
  box-shadow:0 8px 28px rgba(20,14,8,.2);
  font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:8px;
  transform:translate(-10px,-50%);opacity:0;transition:opacity .1s;top:-999px;left:-999px;
}
#drag-ghost.active{opacity:.95;}

/* ── Calendar panel ── */
.cal-panel{display:flex;flex-direction:column;overflow:hidden;}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 8px;flex-shrink:0;gap:6px;}
.cal-title{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:-.2px;flex:1;}
.view-toggle{display:flex;background:var(--sand);border-radius:6px;padding:2px;gap:2px;}
.vt-btn{font-family:var(--sans);font-size:12px;font-weight:500;padding:3px 10px;border:none;border-radius:4px;cursor:pointer;background:transparent;color:var(--text-2);transition:all .15s;}
.vt-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(20,14,8,.09);}
.cal-nav{display:flex;gap:4px;}
.cal-nav button{background:var(--sand);border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:15px;color:var(--text-2);transition:background .15s;}
.cal-nav button:hover{background:var(--border);}
.cal-body{flex:1;overflow:auto;}

/* Month grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 8px 8px;}
.cal-lbl{text-align:center;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--text-3);padding:4px 0 6px;}
.cal-cell{
  min-height:70px;background:var(--card);border:1.5px solid var(--border-lt);
  border-radius:var(--r-sm);padding:4px 3px 3px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.cal-cell:hover:not(.empty){border-color:rgba(201,100,66,.4);}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-cell.selected{border-color:var(--accent);background:#fff9f7;}
.cal-cell.drag-over{border-color:var(--accent);background:rgba(201,100,66,.08);}
.cal-cell.tap-target-ready{border-color:var(--accent);background:rgba(201,100,66,.05);}
.cal-cell.today .date-num{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.date-num{font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:2px;width:20px;}
.cal-tags{display:flex;flex-direction:column;gap:2px;}
.cal-tag{display:flex;align-items:center;gap:3px;padding:1px 4px 1px 3px;border-radius:4px;font-size:10px;font-weight:600;line-height:1.6;overflow:hidden;}
.cal-tag-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.cal-tag-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-overflow{font-size:10px;color:var(--text-3);padding-left:4px;line-height:1.6;}

/* Week view */
.week-wrap{display:flex;flex-direction:column;height:100%;}
.week-col-head{display:grid;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface);}
.wch-spacer{border-right:1px solid var(--border-lt);}
.wch-day{text-align:center;padding:5px 2px;font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--text-3);border-right:1px solid var(--border-lt);}
.wch-date{font-size:16px;font-weight:600;color:var(--text-2);font-family:var(--serif);line-height:1.2;display:block;}
.wch-day.today-col .wch-date{color:var(--accent);}
.week-scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.week-scroll::-webkit-scrollbar{width:4px;}
.week-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.week-unsched-row{display:grid;border-bottom:2px solid var(--border);}
.unsched-lbl{font-size:9px;color:var(--text-3);padding:4px 4px 0 0;text-align:right;border-right:1px solid var(--border-lt);border-bottom:1px solid var(--border-lt);line-height:1.2;}
.week-slot-unsched{min-height:28px;padding:3px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--border-lt);border-bottom:1px solid var(--border-lt);background:var(--surface);transition:background .12s;cursor:pointer;}
.week-slot-unsched:hover,.week-slot-unsched.drag-over{background:rgba(201,100,66,.07);}
.week-slot-unsched.selected-slot{background:#fff9f7;}
.week-slot-unsched.tap-target-ready{background:rgba(201,100,66,.05);}
.week-hour-grid{display:grid;}
.wt-label{font-size:9px;color:var(--text-3);padding:0 4px 0 0;text-align:right;border-right:1px solid var(--border-lt);border-bottom:1px solid var(--border-lt);position:relative;top:-8px;}
.week-slot{min-height:44px;padding:3px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--border-lt);border-bottom:1px solid var(--border-lt);transition:background .12s;cursor:pointer;}
.week-slot:hover{background:rgba(201,100,66,.04);}
.week-slot.drag-over{background:rgba(201,100,66,.09);}
.week-slot.today-slot{background:rgba(201,100,66,.025);}
.week-slot.selected-slot{background:#fff9f7;}
.week-slot.tap-target-ready{background:rgba(201,100,66,.05);}
.week-ev{display:flex;align-items:center;gap:3px;padding:2px 4px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;transition:filter .1s;}
.week-ev:hover{filter:brightness(.88);}

/* ── Right day panel ── */
.day-card{background:var(--card);border:1px solid var(--border-lt);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:6px;}
.day-card.is-done{background:var(--done-bg);}
.day-card-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.day-name{font-size:13px;font-weight:600;flex:1;}
.day-actions{display:flex;gap:4px;}
.act-btn{font-family:var(--sans);font-size:11px;background:var(--sand);border:none;border-radius:5px;padding:3px 9px;cursor:pointer;color:var(--text-2);transition:background .15s;}
.act-btn:hover{background:var(--border);}
.act-btn.done-btn{background:#d4ebd4;color:var(--done-c);}
.time-wrap{display:flex;align-items:center;gap:6px;}
.time-lbl{font-size:11px;color:var(--text-3);}
.time-selects{display:flex;gap:4px;align-items:center;}
.time-sel{font-family:var(--sans);font-size:12px;padding:4px 4px 4px 7px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);outline:none;cursor:pointer;width:auto;}
.time-sel:focus{border-color:var(--accent);}
.time-clear{font-size:11px;color:var(--text-3);cursor:pointer;margin-left:3px;background:none;border:none;padding:2px;}
.time-clear:hover{color:var(--danger-c);}
.day-group{border:1px solid var(--border-lt);border-radius:var(--r-sm);margin-bottom:6px;overflow:hidden;}
.day-group-head{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border-lt);}
.day-group-name{font-size:12px;font-weight:700;flex:1;}
.day-group-count{font-size:11px;color:var(--text-3);}
.day-group-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--card);border-bottom:1px solid var(--border-lt);}
.day-group-item:last-child{border-bottom:none;}
.day-group-item.is-done{background:var(--done-bg);}
.dgi-label{font-size:12px;color:var(--text-2);}
.dgi-label.crossed{text-decoration:line-through;opacity:.55;}
.dgi-actions{display:flex;gap:4px;}
.empty-state{text-align:center;padding:28px 10px;color:var(--text-3);}
.empty-icon{font-size:26px;margin-bottom:8px;}
.empty-state p{font-size:12px;line-height:1.7;}

/* ── Export/Import modal ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,14,8,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--card);border-radius:var(--r);padding:24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(20,14,8,.25);}
.modal h2{font-family:var(--serif);font-size:18px;font-weight:500;margin-bottom:14px;}
.modal p{font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.6;}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap;}
.modal textarea{width:100%;height:100px;resize:vertical;font-size:12px;font-family:monospace;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);outline:none;margin-bottom:12px;}

/* ── Responsive: Tablet ── */
@media(max-width:900px){
  .layout{grid-template-columns:240px 1fr 0;}
  .panel-r{display:none;}
  .panel-r.mob-visible{display:block;position:fixed;right:0;top:var(--nav-h);bottom:0;width:260px;z-index:30;background:var(--card);box-shadow:-4px 0 20px rgba(20,14,8,.12);overflow-y:auto;padding:14px 13px;}
}

/* ── Responsive: Mobile ── */
@media(max-width:600px){
  :root{--nav-h:48px;--bot-h:60px;}
  .app-header h1{font-size:15px;}
  .layout{
    display:block;
    height:calc(100vh - var(--nav-h) - var(--bot-h));
    overflow:hidden;
  }
  .panel-l,.cal-panel,.panel-r{
    position:absolute;inset:var(--nav-h) 0 var(--bot-h) 0;
    overflow-y:auto;display:none;
  }
  .panel-l.mob-active,.cal-panel.mob-active,.panel-r.mob-active{display:block;}
  .panel-l{border-right:none;padding:12px;}
  .panel-r{border-left:none;padding:12px;background:var(--bg);}
  .panel-r.mob-visible{all:unset;position:absolute;inset:var(--nav-h) 0 var(--bot-h) 0;overflow-y:auto;display:block;padding:12px;background:var(--bg);}
  .cal-cell{min-height:54px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    height:var(--bot-h);background:rgba(245,244,237,.96);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bn-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;border:none;background:transparent;cursor:pointer;
    font-family:var(--sans);font-size:10px;font-weight:500;color:var(--text-3);
    transition:color .15s;
  }
  .bn-btn.active{color:var(--accent);}
  .bn-icon{font-size:20px;line-height:1;}
  .global-pct{display:none;}
  .tap-hint{display:block;}
}
</style>
</head>
<body>

<div id="drag-ghost">
  <span id="ghost-dot" class="dot"></span>
  <span id="ghost-name"></span>
</div>

<!-- Export/Import Modal -->
<div id="modal" class="modal-backdrop" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <textarea id="modal-ta" style="display:none;"></textarea>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<header class="app-header">
  <div class="header-row">
    <h1>📚 課程進度追蹤</h1>
    <div class="header-actions">
      <span class="global-pct" id="global-pct"></span>
      <button class="btn btn-sand btn-xs" onclick="showExport()">匯出</button>
      <button class="btn btn-sand btn-xs" onclick="showImport()">匯入</button>
    </div>
  </div>
  <div class="progress-track"><div class="progress-track-fill" id="global-fill" style="width:0%"></div></div>
</header>

<div class="app-shell">
  <div class="layout">

    <aside class="panel panel-l" id="panel-l">
      <div class="section">
        <div class="section-label">新增課程</div>
        <div class="form-group"><input type="text" id="inp-name" placeholder="科目名稱（例：化學）"/></div>
        <div class="form-group"><input type="number" id="inp-total" placeholder="總堂數" min="1"/></div>
        <div class="form-group">
          <div class="form-label">考試日期（選填）</div>
          <input type="date" id="inp-exam"/>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:2px;" onclick="addCourse()">新增課程</button>
      </div>
      <div class="section">
        <div class="section-label">我的課程</div>
        <div id="course-list"></div>
      </div>
      <div class="section">
        <div class="section-label">重複排課</div>
        <div class="form-group"><select id="rep-course"><option value="">選擇科目…</option></select></div>
        <div class="form-label">選擇星期幾上課</div>
        <div class="wday-wrap" id="wday-wrap"></div>
        <div class="form-group">
          <div class="form-label">從哪天開始</div>
          <input type="date" id="rep-start"/>
        </div>
        <button class="btn btn-sand" style="width:100%;" onclick="repeatSchedule()">自動排入剩餘課堂</button>
      </div>
      <div class="section">
        <div class="section-label">待排課堂</div>
        <div class="tap-hint" id="tap-hint">👆 點選課堂，再點日曆格子排入</div>
        <div id="todo-list"></div>
      </div>
    </aside>

    <main class="cal-panel" id="panel-cal">
      <div class="cal-head">
        <div class="cal-title" id="cal-title"></div>
        <div class="view-toggle">
          <button class="vt-btn active" id="vt-month" onclick="setView('month')">月</button>
          <button class="vt-btn" id="vt-week" onclick="setView('week')">週</button>
        </div>
        <div class="cal-nav">
          <button onclick="navPrev()">‹</button>
          <button onclick="jumpToday()" style="width:auto;padding:0 8px;font-size:11px;font-weight:700;">今</button>
          <button onclick="navNext()">›</button>
        </div>
      </div>
      <div class="cal-body" id="cal-body"></div>
    </main>

    <aside class="panel panel-r" id="panel-r">
      <div class="section-label" id="day-label">選擇日期</div>
      <div id="day-events"></div>
    </aside>

  </div>
</div>

<!-- Bottom nav (mobile) -->
<nav class="bottom-nav">
  <button class="bn-btn active" id="bn-course" onclick="mobileTab('course')">
    <span class="bn-icon">📚</span>課程
  </button>
  <button class="bn-btn" id="bn-cal" onclick="mobileTab('cal')">
    <span class="bn-icon">📅</span>行事曆
  </button>
  <button class="bn-btn" id="bn-day" onclick="mobileTab('day')">
    <span class="bn-icon">📋</span>今日
  </button>
</nav>

<script>
// ── PWA ────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
// Inline manifest
const mf={name:'課程進度追蹤',short_name:'課程追蹤',start_url:'./course-tracker.html',display:'standalone',background_color:'#f5f4ed',theme_color:'#f5f4ed',icons:[{src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📚</text></svg>',sizes:'any',type:'image/svg+xml'}]};
const mb=new Blob([JSON.stringify(mf)],{type:'application/json'});
const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(mb);
document.head.appendChild(ml);

// ── State & Palette ───────────────────────────────────────────────
const PALETTE=['#c96442','#7a8c6e','#6b8fa8','#9e7b8a','#c4924a','#5a7a8a','#8a7a9e','#7a6a5a'];
let colorCursor=0;
const S={
  courses:[],calendar:{},
  year:new Date().getFullYear(),month:new Date().getMonth(),
  selectedDate:null,view:'month',weekStart:null,
  dragCourseId:null,tapCourseId:null,cid:1,eid:1,
};
const today=new Date();
const todayStr=ds(today.getFullYear(),today.getMonth(),today.getDate());
S.selectedDate=todayStr;S.weekStart=weekStartOf(todayStr);

// ── Helpers ───────────────────────────────────────────────────────
function ds(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function weekStartOf(s){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()-dt.getDay());return ds(dt.getFullYear(),dt.getMonth(),dt.getDate());}
function addDays(s,n){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return ds(dt.getFullYear(),dt.getMonth(),dt.getDate());}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function allEntries(cid){return Object.values(S.calendar).flat().filter(e=>e.courseId===cid);}
function remaining(c){return Math.max(0,c.total-allEntries(c.id).length);}
function completed(c){return allEntries(c.id).filter(e=>e.done).length;}
function course(id){return S.courses.find(c=>c.id===id);}
function isMobile(){return window.innerWidth<=600;}
const WDAYS=['日','一','二','三','四','五','六'];
const MONTHS=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const HOURS=Array.from({length:16},(_,i)=>i+7);
function fmtDate(s){const[y,m,d]=s.split('-').map(Number);return`${m}月${d}日（週${WDAYS[new Date(y,m-1,d).getDay()]}）`;}

// ── Persistence ───────────────────────────────────────────────────
const LS='course-tracker-v1';
function saveState(){try{localStorage.setItem(LS,JSON.stringify({courses:S.courses,calendar:S.calendar,cid:S.cid,eid:S.eid,colorCursor}));}catch(e){}}
function loadState(){
  try{
    const raw=localStorage.getItem(LS);if(!raw)return;
    const d=JSON.parse(raw);
    if(d.courses)S.courses=d.courses;if(d.calendar)S.calendar=d.calendar;
    if(d.cid)S.cid=d.cid;if(d.eid)S.eid=d.eid;if(d.colorCursor!=null)colorCursor=d.colorCursor;
  }catch(e){}
}

// ── Export / Import ───────────────────────────────────────────────
function exportData(){
  return JSON.stringify({courses:S.courses,calendar:S.calendar,cid:S.cid,eid:S.eid,colorCursor,exportedAt:new Date().toISOString()},null,2);
}
function showExport(){
  openModal('匯出資料','複製以下 JSON，保存到備忘錄或傳給其他裝置後使用「匯入」貼上。',
    [{label:'複製',action:()=>{navigator.clipboard.writeText(exportData()).then(()=>{alert('已複製到剪貼簿！');closeModal();}).catch(()=>{document.getElementById('modal-ta').select();document.execCommand('copy');closeModal();});},primary:true},
     {label:'下載',action:()=>{const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(exportData());a.download=`course-tracker-${todayStr}.json`;a.click();closeModal();}},
     {label:'取消',action:closeModal}],
    exportData());
}
function showImport(){
  openModal('匯入資料','貼上之前匯出的 JSON 資料。⚠️ 這將覆蓋目前所有資料。',
    [{label:'確認匯入',action:()=>{
      const txt=document.getElementById('modal-ta').value.trim();
      try{
        const d=JSON.parse(txt);
        if(!d.courses)throw new Error('格式錯誤');
        if(!confirm('確定匯入？目前資料將被覆蓋。'))return;
        S.courses=d.courses||[];S.calendar=d.calendar||{};
        S.cid=d.cid||1;S.eid=d.eid||1;colorCursor=d.colorCursor||0;
        saveState();render();closeModal();alert('匯入成功！');
      }catch(e){alert('格式錯誤，請貼上正確的備份資料');}
    },primary:true},{label:'取消',action:closeModal}],'');
}
function openModal(title,desc,btns,taVal){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-desc').textContent=desc;
  const ta=document.getElementById('modal-ta');
  if(taVal!==undefined){ta.style.display='block';ta.value=taVal;}else{ta.style.display='none';}
  document.getElementById('modal-btns').innerHTML='';
  btns.forEach(b=>{
    const el=document.createElement('button');
    el.className='btn '+(b.primary?'btn-primary':'btn-sand');
    el.textContent=b.label;el.onclick=b.action;
    document.getElementById('modal-btns').appendChild(el);
  });
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}

// ── Course Actions ────────────────────────────────────────────────
function addCourse(){
  const name=document.getElementById('inp-name').value.trim();
  const total=parseInt(document.getElementById('inp-total').value);
  const examDate=document.getElementById('inp-exam').value||'';
  if(!name||!total||total<1)return;
  S.courses.push({id:`c${S.cid++}`,name,total,color:PALETTE[colorCursor++%PALETTE.length],examDate});
  document.getElementById('inp-name').value='';document.getElementById('inp-total').value='';document.getElementById('inp-exam').value='';
  saveState();render();
}
function deleteCourse(id){
  if(!confirm('確定刪除此科目及所有排定課堂？'))return;
  for(const d in S.calendar){S.calendar[d]=S.calendar[d].filter(e=>e.courseId!==id);if(!S.calendar[d].length)delete S.calendar[d];}
  S.courses=S.courses.filter(c=>c.id!==id);saveState();render();
}
function updateExamDate(id,val){const c=course(id);if(!c)return;c.examDate=val;saveState();renderCourses();}

// ── Event Actions ─────────────────────────────────────────────────
function addEvent(date,courseId,time=''){if(!S.calendar[date])S.calendar[date]=[];S.calendar[date].push({id:`e${S.eid++}`,courseId,time,done:false});}
function removeEvent(date,eid){S.calendar[date]=S.calendar[date].filter(e=>e.id!==eid);if(!S.calendar[date].length)delete S.calendar[date];saveState();render();}
function toggleDone(date,eid){const ev=(S.calendar[date]||[]).find(e=>e.id===eid);if(ev)ev.done=!ev.done;saveState();render();}
function setTime(date,eid,val){const ev=(S.calendar[date]||[]).find(e=>e.id===eid);if(ev)ev.time=val;saveState();renderDayPanel();renderCalendar();}
function setTimeParts(date,eid,h,m){
  const ev=(S.calendar[date]||[]).find(e=>e.id===eid);if(!ev)return;
  const cur=ev.time||'00:00';const[ch,cm]=cur.split(':').map(Number);
  const nh=h!=null?parseInt(h):ch,nm=m!=null?parseInt(m):cm;
  ev.time=`${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
  saveState();renderDayPanel();renderCalendar();
}

// ── Repeat Schedule ───────────────────────────────────────────────
function repeatSchedule(){
  const cid=document.getElementById('rep-course').value;if(!cid){alert('請先選擇科目');return;}
  const days=[...document.querySelectorAll('.rep-day-cb:checked')].map(cb=>+cb.value);if(!days.length){alert('請選擇至少一天');return;}
  const c=course(cid);if(!c)return;let rem=remaining(c);if(rem<=0){alert('此科目已無需排課');return;}
  const start=document.getElementById('rep-start').value||todayStr;let cur=start,added=0;
  for(let i=0;i<730&&rem>0;i++){const[y,m,d]=cur.split('-').map(Number);if(days.includes(new Date(y,m-1,d).getDay())){addEvent(cur,cid);rem--;added++;}cur=addDays(cur,1);}
  if(added){saveState();render();alert(`已為《${c.name}》自動排入 ${added} 堂`);}
}

// ── Exam Badge ────────────────────────────────────────────────────
function examBadge(c){
  if(!c.examDate)return'';
  const days=daysBetween(todayStr,c.examDate),rem=remaining(c);
  if(days<0)return`<span class="exam-badge danger">📋 考試已過期</span>`;
  if(days===0)return`<span class="exam-badge danger">📋 今天考試！</span>`;
  const cls=rem===0?'ok':rem>days*2?'danger':rem>days?'warn':'ok';
  return`<span class="exam-badge ${cls}">📋 考試還有 ${days} 天${rem>0?` · 剩 ${rem} 堂`:' ✓'}</span>`;
}

// ── Mobile Tab ────────────────────────────────────────────────────
let currentMobileTab='course';
function mobileTab(tab){
  currentMobileTab=tab;
  document.getElementById('panel-l').classList.toggle('mob-active',tab==='course');
  document.getElementById('panel-cal').classList.toggle('mob-active',tab==='cal');
  const pr=document.getElementById('panel-r');
  pr.classList.toggle('mob-active',tab==='day');
  pr.classList.remove('mob-visible');
  ['bn-course','bn-cal','bn-day'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('bn-'+tab).classList.add('active');
  if(tab==='day')renderDayPanel();
}

// ── Tap-to-schedule (mobile) ──────────────────────────────────────
function tapTodo(cid){
  if(!isMobile()){return;}
  if(S.tapCourseId===cid){S.tapCourseId=null;}
  else{S.tapCourseId=cid;mobileTab('cal');}
  renderTodo();renderCalendar();
}
function tapCell(date){
  if(!isMobile()||!S.tapCourseId)return false;
  const c=course(S.tapCourseId);
  if(!c||remaining(c)<=0){S.tapCourseId=null;renderTodo();renderCalendar();return false;}
  addEvent(date,c.id,'');S.selectedDate=date;S.tapCourseId=null;
  saveState();render();mobileTab('day');
  return true;
}

// ── Render ────────────────────────────────────────────────────────
function render(){renderHeader();renderCourses();renderRepeatSelect();renderTodo();renderCalendar();renderDayPanel();}

function renderHeader(){
  const total=S.courses.reduce((s,c)=>s+c.total,0);
  const done=S.courses.reduce((s,c)=>s+completed(c),0);
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('global-fill').style.width=pct+'%';
  document.getElementById('global-pct').innerHTML=total>0?`全部 <b>${pct}%</b>`:'';
}
function renderCourses(){
  const el=document.getElementById('course-list');
  if(!S.courses.length){el.innerHTML='<div class="muted">尚未新增課程</div>';return;}
  el.innerHTML=S.courses.map(c=>{
    const done=completed(c),arr=allEntries(c.id).length,pct=Math.min(100,Math.round(done/c.total*100));
    return`<div class="course-card">
      <div class="course-head"><span class="dot" style="background:${c.color}"></span><span class="course-name">${c.name}</span><button class="del-btn" onclick="deleteCourse('${c.id}')">×</button></div>
      <div class="exam-edit-row"><span class="exam-edit-lbl">📋 考試日期</span><input type="date" value="${c.examDate||''}" onchange="updateExamDate('${c.id}',this.value)"/></div>
      ${examBadge(c)}
      <div class="course-meta">共 ${c.total} 堂 · 已排 ${arr} · 完成 ${done} · <b>剩餘 ${remaining(c)}</b></div>
      <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%;background:${c.color}"></div></div>
    </div>`;
  }).join('');
}
function renderRepeatSelect(){
  const sel=document.getElementById('rep-course'),prev=sel.value;
  sel.innerHTML='<option value="">選擇科目…</option>'+S.courses.map(c=>`<option value="${c.id}">${c.name}（剩 ${remaining(c)} 堂）</option>`).join('');
  if(prev)sel.value=prev;
}
function renderTodo(){
  const el=document.getElementById('todo-list');
  const pending=S.courses.filter(c=>remaining(c)>0);
  if(!pending.length){el.innerHTML=`<div class="muted">${S.courses.length?'🎉 所有課堂已排完畢':'新增課程後顯示於此'}</div>`;return;}
  el.innerHTML=pending.map(c=>{
    const isSel=S.tapCourseId===c.id;
    return`<div class="todo-card ${isSel?'tap-selected':''}" draggable="true"
         ondragstart="dragStart(event,'${c.id}')" ondragend="dragEnd(event)"
         onclick="tapTodo('${c.id}')">
      <span class="dot" style="background:${c.color}"></span>
      <div class="todo-info"><div class="todo-name">${c.name}</div><div class="todo-rem">還有 ${remaining(c)} 堂未安排</div></div>
      <span class="drag-icon">⠿</span>
    </div>`;
  }).join('');
}

// ── Month View ────────────────────────────────────────────────────
function renderMonthView(){
  const{year:y,month:m}=S;
  document.getElementById('cal-title').textContent=`${y} 年 ${MONTHS[m]}`;
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let html=WDAYS.map(l=>`<div class="cal-lbl">${l}</div>`).join('');
  for(let i=0;i<first;i++)html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const s=ds(y,m,d),evts=S.calendar[s]||[];
    const isTap=!!S.tapCourseId;
    const cls=['cal-cell',s===todayStr?'today':'',s===S.selectedDate?'selected':'',isTap?'tap-target-ready':''].filter(Boolean).join(' ');
    const tags=evts.slice(0,3).map(ev=>{const c=course(ev.courseId);if(!c)return'';return`<div class="cal-tag" style="background:${c.color}1a;opacity:${ev.done?.5:1}"><span class="cal-tag-dot" style="background:${ev.done?'#b0aea5':c.color}"></span><span class="cal-tag-name" style="color:${ev.done?'var(--text-3)':c.color}">${c.name.slice(0,2)}</span></div>`;}).join('');
    const more=evts.length>3?`<div class="cal-overflow">+${evts.length-3}</div>`:'';
    html+=`<div class="${cls}" onclick="handleCellClick('${s}')"
         ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${s}')">
      <div class="date-num">${d}</div>
      <div class="cal-tags">${tags}${more}</div>
    </div>`;
  }
  document.getElementById('cal-body').innerHTML=`<div class="cal-grid">${html}</div>`;
}

// ── Week View ─────────────────────────────────────────────────────
function renderWeekView(){
  const weekDays=Array.from({length:7},(_,i)=>addDays(S.weekStart,i));
  const[sy,sm,sd]=weekDays[0].split('-').map(Number);
  const[,em,ed]=weekDays[6].split('-').map(Number);
  document.getElementById('cal-title').textContent=`${sy}年${sm}月${sd}日–${em}月${ed}日`;
  const col=`36px repeat(7,1fr)`,isTap=!!S.tapCourseId;
  let headHtml=`<div class="wch-spacer"></div>`;
  weekDays.forEach((s,i)=>{const[,m,d]=s.split('-').map(Number);headHtml+=`<div class="wch-day ${s===todayStr?'today-col':''}">${WDAYS[i]}<span class="wch-date">${d}</span></div>`;});
  let unHtml=`<div class="unsched-lbl">未定時</div>`;
  weekDays.forEach(s=>{
    const evts=(S.calendar[s]||[]).filter(e=>!e.time);
    const cls=['week-slot-unsched',s===S.selectedDate?'selected-slot':'',isTap?'tap-target-ready':''].filter(Boolean).join(' ');
    unHtml+=`<div class="${cls}" onclick="handleCellClick('${s}')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${s}','')">${evts.map(ev=>wkEv(ev,s)).join('')}</div>`;
  });
  let rowsHtml='';
  HOURS.forEach(h=>{
    const t=String(h).padStart(2,'0')+':00';
    rowsHtml+=`<div class="wt-label">${t}</div>`;
    weekDays.forEach(s=>{
      const evts=(S.calendar[s]||[]).filter(e=>e.time&&parseInt(e.time)===h);
      const cls=['week-slot',s===todayStr?'today-slot':'',s===S.selectedDate?'selected-slot':'',isTap?'tap-target-ready':''].filter(Boolean).join(' ');
      rowsHtml+=`<div class="${cls}" onclick="handleCellClick('${s}')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${s}','${t}')">${evts.map(ev=>wkEv(ev,s)).join('')}</div>`;
    });
  });
  const body=document.getElementById('cal-body');
  body.innerHTML=`<div class="week-wrap"><div class="week-col-head" style="display:grid;grid-template-columns:${col};">${headHtml}</div><div class="week-scroll"><div class="week-unsched-row" style="grid-template-columns:${col};">${unHtml}</div><div class="week-hour-grid" style="display:grid;grid-template-columns:${col};">${rowsHtml}</div></div></div>`;
  setTimeout(()=>{const sc=body.querySelector('.week-scroll');if(sc)sc.scrollTop=48;},30);
}

function wkEv(ev,date){
  const c=course(ev.courseId);if(!c)return'';
  const lbl=(ev.time?ev.time.slice(0,5)+' ':'')+c.name.slice(0,3);
  return`<div class="week-ev" style="background:${c.color}18;color:${c.color};${ev.done?'opacity:.45;text-decoration:line-through':''}" title="${c.name}${ev.time?' @ '+ev.time:''}" onclick="event.stopPropagation();selectDate('${date}');${isMobile()?'mobileTab(\'day\')':''}"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${c.color};flex-shrink:0;"></span>${lbl}</div>`;
}

function handleCellClick(date){
  if(tapCell(date))return;  // mobile tap-to-schedule
  selectDate(date);
  if(isMobile())mobileTab('day');
}

function renderCalendar(){
  document.getElementById('vt-month').className='vt-btn'+(S.view==='month'?' active':'');
  document.getElementById('vt-week').className='vt-btn'+(S.view==='week'?' active':'');
  if(S.view==='month')renderMonthView();else renderWeekView();
}

function renderDayPanel(){
  const label=document.getElementById('day-label');
  const el=document.getElementById('day-events');
  if(!S.selectedDate){label.textContent='選擇日期';el.innerHTML=`<div class="empty-state"><div class="empty-icon">📅</div><p>點擊行事曆格子<br>查看當天課程安排</p></div>`;return;}
  label.textContent=fmtDate(S.selectedDate);
  const allEvts=S.calendar[S.selectedDate]||[];
  if(!allEvts.length){el.innerHTML=`<div class="empty-state"><div class="empty-icon">✨</div><p>這天還沒有課程<br>${isMobile()?'點選「行事曆」標籤選課堂':'從左側拖曳課堂到這個日期'}</p></div>`;return;}
  const timed=allEvts.filter(e=>e.time).slice().sort((a,b)=>a.time.localeCompare(b.time));
  const untimed=allEvts.filter(e=>!e.time);
  const groups={};
  untimed.forEach(ev=>{if(!groups[ev.courseId])groups[ev.courseId]=[];groups[ev.courseId].push(ev);});
  let html='';
  timed.forEach(ev=>{
    const c=course(ev.courseId);if(!c)return;
    const[hh,mm]=ev.time?ev.time.split(':').map(Number):[0,0];
    const hourOpts=Array.from({length:24},(_,i)=>`<option value="${i}" ${i===hh?'selected':''}>${String(i).padStart(2,'0')}</option>`).join('');
    const minOpts=[0,5,10,15,20,25,30,35,40,45,50,55].map(m=>`<option value="${m}" ${m===mm?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('');
    html+=`<div class="day-card ${ev.done?'is-done':''}">
      <div class="day-card-head"><span class="dot" style="background:${c.color}"></span><span class="day-name" style="${ev.done?'text-decoration:line-through;opacity:.55':''}">${c.name}</span>
        <div class="day-actions"><button class="act-btn ${ev.done?'done-btn':''}" onclick="toggleDone('${S.selectedDate}','${ev.id}')">${ev.done?'取消':'完成'}</button><button class="act-btn" onclick="removeEvent('${S.selectedDate}','${ev.id}')">移除</button></div>
      </div>
      <div class="time-wrap"><span class="time-lbl">時間</span>
        <div class="time-selects">
          <select class="time-sel" onchange="setTimeParts('${S.selectedDate}','${ev.id}',this.value,null)">${hourOpts}</select>
          <span>:</span>
          <select class="time-sel" onchange="setTimeParts('${S.selectedDate}','${ev.id}',null,this.value)">${minOpts}</select>
          <button class="time-clear" onclick="setTime('${S.selectedDate}','${ev.id}','')">✕</button>
        </div>
      </div>
    </div>`;
  });
  Object.keys(groups).forEach(cid=>{
    const c=course(cid);if(!c)return;
    const items=groups[cid];
    const itemsHtml=items.map((ev,idx)=>`<div class="day-group-item ${ev.done?'is-done':''}"><span class="dgi-label ${ev.done?'crossed':''}">第 ${idx+1} 堂</span><div class="dgi-actions"><button class="act-btn ${ev.done?'done-btn':''}" onclick="toggleDone('${S.selectedDate}','${ev.id}')">${ev.done?'取消':'完成'}</button><button class="act-btn" onclick="removeEvent('${S.selectedDate}','${ev.id}')">移除</button></div></div>`).join('');
    html+=`<div class="day-group"><div class="day-group-head"><span class="dot" style="background:${c.color}"></span><span class="day-group-name">${c.name}</span><span class="day-group-count">${items.length} 堂（未定時）</span></div>${itemsHtml}</div>`;
  });
  el.innerHTML=html;
}

// ── Drag & Drop ───────────────────────────────────────────────────
const ghost=document.getElementById('drag-ghost');
const ghostDot=document.getElementById('ghost-dot');
const ghostName=document.getElementById('ghost-name');
function dragStart(e,cid){
  S.dragCourseId=cid;e.dataTransfer.effectAllowed='copy';
  const c=course(cid);if(c){ghostDot.style.background=c.color;ghostName.textContent=c.name;}
  setTimeout(()=>{e.currentTarget.classList.add('dragging');ghost.classList.add('active');},0);
}
function dragEnd(e){e.currentTarget.classList.remove('dragging');ghost.classList.remove('active');S.dragCourseId=null;}
document.addEventListener('dragover',e=>{ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';});
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
function drop(e,date,time=''){
  e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('drag-over');
  const c=course(S.dragCourseId);if(!c||remaining(c)<=0)return;
  addEvent(date,c.id,time);S.selectedDate=date;saveState();render();
}

// ── Navigation ────────────────────────────────────────────────────
function setView(v){S.view=v;if(v==='week')S.weekStart=weekStartOf(S.selectedDate||todayStr);render();}
function selectDate(s){S.selectedDate=s;if(S.view==='week')S.weekStart=weekStartOf(s);render();}
function navPrev(){if(S.view==='month'){if(--S.month<0){S.month=11;S.year--;}}else S.weekStart=addDays(S.weekStart,-7);render();}
function navNext(){if(S.view==='month'){if(++S.month>11){S.month=0;S.year++;}}else S.weekStart=addDays(S.weekStart,7);render();}
function jumpToday(){S.year=today.getFullYear();S.month=today.getMonth();S.selectedDate=todayStr;S.weekStart=weekStartOf(todayStr);render();}

// ── Init ──────────────────────────────────────────────────────────
const ww=document.getElementById('wday-wrap');
WDAYS.forEach((w,i)=>{const wrap=document.createElement('div');wrap.innerHTML=`<input type="checkbox" class="rep-day-cb wday-cb" id="wd${i}" value="${i}"><label class="wday-label" for="wd${i}">${w}</label>`;ww.appendChild(wrap);});
document.getElementById('rep-start').value=todayStr;
document.getElementById('inp-name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inp-total').focus();});
document.getElementById('inp-total').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inp-exam').focus();});
document.getElementById('inp-exam').addEventListener('keydown',e=>{if(e.key==='Enter')addCourse();});

// Init mobile layout
if(isMobile()){
  document.getElementById('panel-l').classList.add('mob-active');
}

loadState();
render();
</script>
</body>
