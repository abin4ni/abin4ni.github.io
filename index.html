// ── Quick Input Parser ────────────────────────────────────────────
// 一定要有「週／周／星期／禮拜」前綴，避免「數學一」「三角函數」被誤判成星期
const WDAY_RE=/(?:週|周|星期|禮拜|礼拜)([日天一二三四五六])/;
const WDAY_IDX={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};

function parseQuickInput(raw){
  const s=raw.trim();
  if(!s)return null;

  const totals=[...s.matchAll(/([+-]?\d+(?:\.\d+)?)\s*[堂節]/g)];
  if(totals.length>1)return {error:'請只輸入一個總堂數。'};
  const total=totals.length ? Number(totals[0][1]) : 1;
  if(!Number.isSafeInteger(total)||total<1)return {error:'總堂數須為正整數，例如 30堂。'};
  if(!totals.length&&/(?:^|\s)[堂節](?=\s|$)/.test(s))return {error:'請在「堂」或「節」前填入堂數。'};

  // Preserve the supported colons and the hour-only 點 shorthand.
  const times=[...s.matchAll(/(\d+)([:：點])(\d*)/g)];
  if(times.length>1)return {error:'請只輸入一個上課時間。'};
  let time='';
  if(times.length){
    const [token,h,separator,m]=times[0];
    const next=s[times[0].index+token.length];
    const negativeTime=/(?:^|\s)-$/.test(s.slice(0,times[0].index));
    if(negativeTime||h.length>2||Number(h)>23||m.length>2||Number(m)>59||
       (!m&&separator!=='點')||next===':'||next==='：'){
      return {error:'請修正上課時間。小時為 0–23，分鐘為 0–59，例如 19:00。'};
    }
    time=h.padStart(2,'0')+':'+(m||'0').padStart(2,'0');
  }

  const weekdays=[...s.matchAll(new RegExp(WDAY_RE.source,'g'))];
  if(weekdays.length>1)return {error:'請只輸入一個上課星期。'};
  if(/(?:週|周|星期|禮拜|礼拜)(?:[0-9０-９八九十]|(?=\s|$))/.test(s)){
    return {error:'請修正上課星期，例如 週三 或 星期日。'};
  }
  const wday=weekdays.length ? WDAY_IDX[weekdays[0][1]] : null;
  const name=s.replace(/([+-]?\d+(?:\.\d+)?)\s*[堂節]/g,'')
    .replace(/\d+[:：點]\d*/g,'')
    .replace(/[（(].*?[）)]/g,'')
    .replace(new RegExp(WDAY_RE.source,'g'),'')
    .replace(/\s+/g,' ').trim();
  if(!name)return {error:'請輸入科目名稱，例如 英文。'};
  return {name,wday,time,total};
}

function quickScheduleDates({wday,total}){
  const dates=[];
  if(wday===null)return dates;
  let date=todayStr;
  for(let i=0;i<365&&dates.length<total;i++){
    const [year,month,day]=date.split('-').map(Number);
    if(new Date(year,month-1,day).getDay()===wday)dates.push(date);
    date=addDays(date,1);
  }
  return dates;
}

function initQuickInput(){
  const input=document.getElementById('quick-input');
  const preview=document.getElementById('quick-preview');
  const error=document.getElementById('quick-error');
  const button=document.getElementById('quick-submit');
  let composing=false;

  function refresh(){
    const parsed=composing ? null : parseQuickInput(input.value);
    const valid=parsed&&!parsed.error;
    preview.classList.toggle('show',!!valid);
    error.textContent=parsed?.error||'';
    if(parsed?.error)input.setAttribute('aria-invalid','true');
    else input.removeAttribute('aria-invalid');
    button.disabled=!valid;
    button.textContent='建立課程';
    if(!valid)return;

    const dates=quickScheduleDates(parsed);
    document.getElementById('quick-course-name').textContent=parsed.name;
    document.getElementById('quick-weekday').textContent=parsed.wday===null?'未指定':'每週'+WDAYS[parsed.wday];
    document.getElementById('quick-time').textContent=parsed.time||'未指定';
    document.getElementById('quick-total').textContent=parsed.total+' 堂';
    document.getElementById('quick-plan').textContent=dates.length
      ? '建立並排課 · 新增 '+dates.length+' 堂 · '+dates[0]+(dates.length>1?' 至 '+dates.at(-1):'')+
        (dates.length<parsed.total?' · 剩餘 '+(parsed.total-dates.length)+' 堂未排':'')
      : '只建立課程 · 不新增課堂'+(parsed.time?'，所填時間不會排入行事曆。':'。');
    if(dates.length)button.textContent='建立並排課';
    return {parsed,dates};
  }
  function create(){
    const plan=refresh();
    if(!plan)return;
    // Consume the input before saving so repeated activation can't create it twice.
    input.value='';
    refresh();
    submitQuickInput(plan.parsed,plan.dates);
  }
  input.addEventListener('input',event=>{if(!event.isComposing)refresh();});
  input.addEventListener('compositionstart',()=>{composing=true;refresh();});
  input.addEventListener('compositionend',()=>{composing=false;refresh();});
  input.addEventListener('keydown',event=>{
    if(composing||event.isComposing||event.keyCode===229)return;
    if(event.key==='Enter'){
      event.preventDefault();
      if(!event.repeat)create();
    }else if(event.key==='Escape'){
      input.value='';
      refresh();
    }
  });
  button.addEventListener('click',create);
  refresh();
}

function submitQuickInput(parsed,dates){
  const id=`c${S.cid++}`;
  const color=PALETTE[colorCursor++%PALETTE.length];
  S.courses.push({id,name:parsed.name,total:parsed.total,color,examDate:'',lessonStart:1,lessonEnd:parsed.total});

  for(const date of dates)addEvent(date,id,parsed.time);
  if(dates.length){
    toast(calendarScheduleMessage(`「${parsed.name}」已排入 ${dates.length} 堂（每週${WDAYS[parsed.wday]}）`,id),'success',3500);
  }else{
    toast(`已新增「${parsed.name}」（${parsed.total} 堂）`,'success');
  }

  invalidateEntriesCache();
  saveState();render();
  requestAnimationFrame(()=>{
    const cards=document.querySelectorAll('#course-list .course-card');
    if(cards.length)cards[cards.length-1].classList.add('new-card');
  });
}

// ── Drag & Drop ───────────────────────────────────────────────────
// UI override: structured day panel sections (courses / notes / stats).
// UI-only draft; never included in statePayload or written until confirmed.

function initScheduleTime(prefix,onTimeEdit){
  const template=document.getElementById('schedule-time-template');
  const content=template.content.cloneNode(true);
  if(prefix!=='day'){
    for(const element of content.querySelectorAll('[id],[for],[aria-labelledby],[aria-controls],[aria-describedby]')){
      for(const attribute of ['id','for','aria-labelledby','aria-controls','aria-describedby']){
        if(element.hasAttribute(attribute)){
          element.setAttribute(attribute,element.getAttribute(attribute).replaceAll('day-',prefix+'-'));
        }
      }
    }
  }
  document.getElementById(prefix+'-time-slot').replaceWith(content);
  const picker=document.getElementById(prefix+'-time-picker');
  const trigger=document.getElementById(prefix+'-time-trigger');
  const display=document.getElementById(prefix+'-time-value');
  const value=document.getElementById(prefix+'-schedule-time');
  const editor=document.getElementById(prefix+'-time-editor');
  const options=document.getElementById(prefix+'-time-options');
  const hour=document.getElementById(prefix+'-time-hour');
  const minute=document.getElementById(prefix+'-time-minute');
  const manual=document.getElementById(prefix+'-time-manual');
  const input=document.getElementById(prefix+'-time-manual-input');
  const error=document.getElementById(prefix+'-time-error');
  const manualButton=document.getElementById(prefix+'-time-manual-open');
  const doubleTapInterval=400;
  let lastTap=-Infinity;
  let revealTimer;

  function setValue(time){
    value.value=time;
    display.textContent=time||'未定時間';
  }
  function clearError(){
    input.removeAttribute('aria-invalid');
    error.textContent='';
  }
  function selectPart(list,index){
    list.querySelector('[aria-selected="true"]')?.setAttribute('aria-selected','false');
    const option=list.children[index];
    option.setAttribute('aria-selected','true');
    list.setAttribute('aria-activedescendant',option.id);
  }
  function scrollToPart(list,index){
    selectPart(list,index);
    list.scrollTop=index*list.firstElementChild.offsetHeight;
  }
  function partAtCenter(list){
    const index=Math.round(list.scrollTop/list.firstElementChild.offsetHeight);
    return Math.max(0,Math.min(index,list.children.length-1));
  }
  function buildList(list,length){
    const items=document.createDocumentFragment();
    for(let number=0;number<length;number++){
      const option=document.createElement('div');
      option.id=list.id+'-'+number;
      option.textContent=String(number).padStart(2,'0');
      option.setAttribute('role','option');
      option.setAttribute('aria-selected','false');
      items.appendChild(option);
    }
    list.appendChild(items);
    list.addEventListener('scroll',()=>{
      if(!editor.hidden&&manual.hidden)selectPart(list,partAtCenter(list));
    });
    list.addEventListener('click',event=>{
      const option=event.target.closest('[role="option"]');
      if(!option)return;
      scrollToPart(list,Number(option.textContent));
      list.focus({preventScroll:true});
    });
    list.addEventListener('keydown',event=>{
      const current=partAtCenter(list);
      const next={
        ArrowUp:Math.max(current-1,0),
        ArrowDown:Math.min(current+1,length-1),
        Home:0,
        End:length-1
      }[event.key];
      if(next===undefined)return;
      event.preventDefault();
      scrollToPart(list,next);
    });
  }
  function closeEditor(returnFocus){
    clearTimeout(revealTimer);
    editor.hidden=true;
    trigger.setAttribute('aria-expanded','false');
    lastTap=-Infinity;
    if(returnFocus)trigger.focus();
  }
  function openOptions(){
    editor.hidden=false;
    options.hidden=false;
    manual.hidden=true;
    manualButton.hidden=false;
    trigger.setAttribute('aria-expanded','true');
    const [hours,minutes]=(value.value||'00:00').split(':').map(Number);
    scrollToPart(hour,hours);
    scrollToPart(minute,minutes);
  }
  function openManual(){
    clearTimeout(revealTimer);
    options.hidden=true;
    manual.hidden=false;
    manualButton.hidden=true;
    input.value=value.value;
    clearError();
    input.focus();
    input.select();
  }
  function apply(){
    if(manual.hidden){
      setValue(hour.children[partAtCenter(hour)].textContent+':'+minute.children[partAtCenter(minute)].textContent);
    }else{
      const time=input.value.trim().match(/^([01]?[0-9]|2[0-3]):([0-5][0-9])$/);
      if(!time){
        input.setAttribute('aria-invalid','true');
        error.textContent='請輸入 0–23 小時、00–59 分鐘，例如 9:05 或 09:05。';
        input.focus();
        return;
      }
      setValue(time[1].padStart(2,'0')+':'+time[2]);
    }
    onTimeEdit?.();
    closeEditor(true);
  }

  buildList(hour,24);
  buildList(minute,60);
  trigger.addEventListener('click',event=>{
    if(event.detail===0 && !event.pointerType){
      if(editor.hidden)openOptions();
      (manual.hidden?hour:input).focus();
      return;
    }
    const now=performance.now();
    if(editor.hidden){
      openOptions();
      trigger.focus({preventScroll:true});
      // Keep the trigger in place for the second tap before revealing any clipped controls.
      revealTimer=setTimeout(()=>picker.scrollIntoView({block:'nearest'}),doubleTapInterval);
    }else if(manual.hidden&&(event.detail>=2||now-lastTap<=doubleTapInterval)){
      openManual();
    }
    lastTap=now;
  });

  editor.addEventListener('pointerdown',()=>clearTimeout(revealTimer));
  manualButton.addEventListener('click',openManual);
  input.addEventListener('input',clearError);
  document.getElementById(prefix+'-time-apply').addEventListener('click',apply);
  document.getElementById(prefix+'-time-cancel').addEventListener('click',()=>closeEditor(true));
  document.getElementById(prefix+'-time-clear').addEventListener('click',()=>{
    setValue('');
    onTimeEdit?.();
    closeEditor(true);
  });
  picker.addEventListener('keydown',event=>{
    event.stopPropagation();
    if(event.target===trigger&&(event.key==='Enter'||event.key===' ')){
      event.preventDefault();
      if(!event.repeat){
        if(editor.hidden)openOptions();
        (manual.hidden?hour:input).focus();
      }
    }else if(event.target===input&&event.key==='Enter'){
      event.preventDefault();
      if(!event.isComposing)apply();
    }
  });
  const dialog=picker.closest('dialog');
  (dialog||document).addEventListener('keydown',event=>{
    if(!dialog&&document.querySelector('dialog[open]'))return;
    if(event.key==='Escape'&&!editor.hidden&&!event.isComposing){
      event.preventDefault();
      event.stopPropagation();
      closeEditor(true);
    }
  },true);
  picker.addEventListener('touchstart',event=>event.stopPropagation(),{passive:true});

  return (initialTime='')=>{
    closeEditor(false);
    setValue(initialTime);
  };
}
const resetDayScheduleTime=initScheduleTime('day');
const resetRescheduleTime=initScheduleTime('reschedule',()=>{
  if(rescheduleDraft)rescheduleDraft.timeEdited=true;
});

let dayScheduleDate=null;
function cancelDaySchedule(){
  dayScheduleDate=null;
  document.getElementById('day-schedule-form').reset();
  resetDayScheduleTime();
  document.getElementById('day-schedule-date').textContent='';
  document.getElementById('day-schedule-message').textContent='';
  document.getElementById('day-schedule-form').hidden=true;
  document.getElementById('day-schedule-open').setAttribute('aria-expanded','false');
}
function refreshDayScheduleCourses(){
  const select=document.getElementById('day-schedule-course');
  const previous=select.value;
  select.replaceChildren();
  const pending=S.courses.filter(c=>remaining(c)>0);
  pending.forEach(c=>{
    const option=document.createElement('option');
    option.value=c.id;option.textContent=c.name+'（剩 '+remaining(c)+' 堂）';
    select.appendChild(option);
  });
  if(pending.some(c=>c.id===previous))select.value=previous;
  select.disabled=!pending.length;
  document.getElementById('day-schedule-confirm').disabled=!pending.length;
  document.getElementById('day-schedule-message').textContent=pending.length?'':(S.courses.length?'所有課程都已排滿，目前沒有可安排的課堂。':'目前沒有可安排的課程，請先到「課程」新增課程。');
}
function openDaySchedule(){
  dayScheduleDate=S.selectedDate||todayStr;
  document.getElementById('day-schedule-date').textContent='安排日期：'+fmtDate(dayScheduleDate);
  resetDayScheduleTime();
  refreshDayScheduleCourses();
  document.getElementById('day-schedule-form').hidden=false;
  document.getElementById('day-schedule-open').setAttribute('aria-expanded','true');
}
function submitDaySchedule(event){
  event.preventDefault();
  if(!dayScheduleDate)return;
  if((S.selectedDate||todayStr)!==dayScheduleDate){cancelDaySchedule();return;}
  const c=course(document.getElementById('day-schedule-course').value);
  if(!c||remaining(c)<=0){refreshDayScheduleCourses();return;}
  const date=dayScheduleDate;
  const time=document.getElementById('day-schedule-time').value;
  cancelDaySchedule(); // consume once, including repeated submit events
  addEvent(date,c.id,time);
  S.selectedDate=date;
  saveState();render();
  toast(calendarScheduleMessage('已安排一堂課程',c.id),'success');
}
const rescheduleDialog=document.getElementById('reschedule-dialog');
const rescheduleDate=document.getElementById('reschedule-date');
const rescheduleMessage=document.getElementById('reschedule-message');
const rescheduleConfirm=document.getElementById('reschedule-confirm');
let rescheduleDraft=null;

function rescheduleButton(id){
  return [...document.querySelectorAll('#day-events [data-reschedule-event]')]
    .find(button=>button.dataset.rescheduleEvent===id);
}
function closeLessonReschedule(restoreFocus=true){
  const id=rescheduleDraft?.id;
  rescheduleDraft=null;
  resetRescheduleTime();
  rescheduleDialog.close();
  if(restoreFocus)(rescheduleButton(id)||document.getElementById('day-schedule-open')).focus();
}
function openLessonReschedule(id){
  const date=S.selectedDate;
  const lesson=S.calendar[date]?.find(item=>item.id===id);
  if(!lesson){toast('找不到原課堂，請重新選擇。','warn');return;}
  const time=lesson.time||'';
  rescheduleDraft={date,id,timeEdited:false};
  rescheduleDate.value=date;
  rescheduleDate.removeAttribute('aria-invalid');
  rescheduleMessage.textContent='';
  rescheduleConfirm.disabled=false;
  document.getElementById('reschedule-original').textContent='原日期 '+date+' · '+(time||'未定時間');
  resetRescheduleTime(time);
  rescheduleDialog.showModal();
}
function submitLessonReschedule(event){
  event.preventDefault();
  if(!rescheduleDraft)return;
  const {date,id,timeEdited}=rescheduleDraft;
  const source=S.calendar[date];
  const index=source?.findIndex(item=>item.id===id)??-1;
  if(index<0){
    rescheduleMessage.textContent='原日期已找不到這堂課，可能已被刪除或改期。';
    rescheduleConfirm.disabled=true;
    document.getElementById('reschedule-cancel').focus();
    return;
  }
  if(!rescheduleDate.value||!rescheduleDate.validity.valid){
    rescheduleDate.setAttribute('aria-invalid','true');
    rescheduleMessage.textContent='請選擇有效的新日期。';
    rescheduleDate.focus();
    return;
  }
  const lesson=source[index];
  const newDate=rescheduleDate.value;
  const chosenTime=document.getElementById('reschedule-schedule-time').value;
  // If time was left alone, keep the current value even if sync changed it.
  const currentTime=lesson.time||'';
  const time=timeEdited ? chosenTime : currentTime;
  if(newDate===date&&time===currentTime){closeLessonReschedule();return;}

  closeLessonReschedule(false);
  if(newDate!==date){
    source.splice(index,1);
    if(!source.length)delete S.calendar[date];
    (S.calendar[newDate]??=[]).push(lesson);
  }
  if(time!==currentTime)lesson.time=time;
  invalidateEntriesCache();
  saveState();

  const [year,month]=newDate.split('-').map(Number);
  S.year=year;
  S.month=month-1;
  selectDate(newDate);
  if(isMobile())mobileTab('day');
  rescheduleButton(id)?.focus();
  toast(calendarScheduleMessage('已改期',lesson.courseId),'success');
}
rescheduleDate.addEventListener('input',()=>{
  rescheduleDate.removeAttribute('aria-invalid');
  if(!rescheduleConfirm.disabled)rescheduleMessage.textContent='';
});
rescheduleDialog.addEventListener('cancel',event=>{
  event.preventDefault();
  closeLessonReschedule();
});
rescheduleDialog.addEventListener('keydown',event=>event.stopPropagation());
document.getElementById('reschedule-cancel').addEventListener('click',()=>closeLessonReschedule());
document.getElementById('day-events').addEventListener('click',event=>{
  const button=event.target.closest('[data-reschedule-event]');
  if(button)openLessonReschedule(button.dataset.rescheduleEvent);
});

function renderDayPanel(){
  if(dayScheduleDate){
    if((S.selectedDate||todayStr)!==dayScheduleDate)cancelDaySchedule();
    else refreshDayScheduleCourses();
  }
  const label=document.getElementById('day-label');
  const el=document.getElementById('day-events');

  if(!S.selectedDate){
    label.textContent='選擇日期';
    el.innerHTML=`<div class="day-panel-shell">
      <section class="day-panel-section day-panel-main">
        <h3 class="day-panel-title">${isMobile()?'當日課程':'今日課程'}</h3>
        <div class="empty-state"><p>點選行事曆日期後，這裡會顯示可操作課程。</p></div>
      </section>
      <section class="day-panel-section day-panel-notes">
        <h3 class="day-panel-title">提醒事項</h3>
        <p class="memo-empty">請選擇日期查看當天課程的備忘錄。</p>
      </section>
      <section class="day-panel-section day-panel-meta">
        <h3 class="day-panel-title">完成狀態</h3>
        <div class="day-panel-stats">
          <div class="day-today-stat"><div class="dts-val">0</div><div class="dts-lbl">課堂</div></div>
          <div class="day-today-stat"><div class="dts-val day-completed-count">0</div><div class="dts-lbl">完成</div></div>
          <div class="day-today-stat"><div class="dts-val day-progress-count">0%</div><div class="dts-lbl">進度</div></div>
        </div>
      </section>
    </div>`;
    return;
  }

  label.textContent=fmtDate(S.selectedDate);
  if(S.selectedDate===todayStr){
    const badge=document.createElement('span');
    badge.className='day-label-today-badge';
    badge.textContent='今天';
    label.appendChild(badge);
  }
  const allEvts=S.calendar[S.selectedDate]||[];
  const dayTotal=allEvts.length;
  const dayDone=allEvts.filter(e=>e.done).length;
  const dayRate=dayTotal>0?Math.round(dayDone/dayTotal*100):0;

  const timed=allEvts.filter(e=>e.time).slice().sort((a,b)=>a.time.localeCompare(b.time));
  const untimed=allEvts.filter(e=>!e.time);
  const groups={};
  untimed.forEach(ev=>{if(!groups[ev.courseId])groups[ev.courseId]=[];groups[ev.courseId].push(ev);});

  let courseHtml='';

  timed.forEach(ev=>{
    const c=course(ev.courseId);if(!c)return;
    const[hh,mm]=ev.time?ev.time.split(':').map(Number):[0,0];
    const hourOpts=Array.from({length:24},(_,i)=>`<option value="${i}" ${i===hh?'selected':''}>${String(i).padStart(2,'0')}</option>`).join('');
    const minutes=[0,5,10,15,20,25,30,35,40,45,50,55];
    if(Number.isInteger(mm)&&!minutes.includes(mm))minutes.push(mm);
    const minOpts=minutes.sort((a,b)=>a-b).map(m=>`<option value="${m}" ${m===mm?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('');
    courseHtml+=`<div class="day-card ${ev.done?'is-done':''}">
      <div class="day-card-head">
        <button type="button" class="done-check ${ev.done?'checked':''}" onclick="toggleDone('${S.selectedDate}','${ev.id}')" aria-label="完成課堂" aria-pressed="${ev.done}">${ev.done?'✓':''}</button>
        <span class="dot" style="background:${c.color}"></span>
        <span class="day-name${ev.done?' is-done':''}">${esc(c.name)}</span>
      </div>
      <div class="day-card-tools">
        <div class="time-wrap">
          <div class="time-selects">
            <select class="time-sel" aria-label="小時" onchange="setTimeParts('${S.selectedDate}','${ev.id}',this.value,null)">${hourOpts}</select>
            <span>:</span>
            <select class="time-sel" aria-label="分鐘" onchange="setTimeParts('${S.selectedDate}','${ev.id}',null,this.value)">${minOpts}</select>
            <button type="button" class="time-clear" onclick="setTime('${S.selectedDate}','${ev.id}','')">清空</button>
          </div>
        </div>
        <div class="day-actions">
          <button type="button" class="act-btn day-reschedule-button" data-reschedule-event="${esc(ev.id)}">改期</button>
          <button class="act-btn" onclick="removeEvent('${S.selectedDate}','${ev.id}')">刪除</button>
        </div>
      </div>
    </div>`;
  });

  Object.keys(groups).forEach(cid=>{
    const c=course(cid);if(!c)return;
    const items=groups[cid];
    const doneBefore=Object.entries(S.calendar)
      .filter(([d])=>d<S.selectedDate)
      .flatMap(([,evs])=>evs)
      .filter(e=>e.courseId===cid&&e.done).length;
    const ls=c.lessonStart??1;
    const itemsHtml=items.map((ev,idx)=>{
      const lessonNo=ls+doneBefore+idx;
      const minOpts=[0,5,10,15,20,25,30,35,40,45,50,55].map(m=>`<option value="${m}">${String(m).padStart(2,'0')}</option>`).join('');
      const hourOpts=Array.from({length:24},(_,i)=>`<option value="${i}">${String(i).padStart(2,'0')}</option>`).join('');
      return`<div class="day-group-item ${ev.done?'is-done':''}">
        <button type="button" class="done-check ${ev.done?'checked':''}" onclick="toggleDone('${S.selectedDate}','${ev.id}')" aria-label="完成課堂" aria-pressed="${ev.done}">${ev.done?'✓':''}</button>
        <div class="day-group-content">
          <div class="day-group-controls">
            <span class="dgi-label ${ev.done?'crossed':''}">課次 ${lessonNo}</span>
            <div class="dgi-actions">
              <button type="button" class="act-btn day-reschedule-button" data-reschedule-event="${esc(ev.id)}">改期</button>
              <button class="act-btn" onclick="removeEvent('${S.selectedDate}','${ev.id}')">刪除</button>
            </div>
          </div>
          <div class="time-wrap" style="margin-top:0;">
            <span class="time-lbl">未定時</span>
            <div class="time-selects">
              <select class="time-sel" aria-label="小時" onchange="setTimeParts('${S.selectedDate}','${ev.id}',this.value,null)">${hourOpts}</select>
              <span class="time-colon">:</span>
              <select class="time-sel" aria-label="分鐘" onchange="setTimeParts('${S.selectedDate}','${ev.id}',null,this.value)">${minOpts}</select>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
    courseHtml+=`<div class="day-group">
      <div class="day-group-head">
        <span class="dot" style="background:${c.color}"></span>
        <span class="day-group-name">${esc(c.name)}</span>
        <span class="day-group-count">${items.filter(e=>e.done).length}/${items.length} 完成</span>
      </div>
      ${itemsHtml}
    </div>`;
  });

  if(!courseHtml){
    courseHtml=`<div class="empty-state"><p>這天還沒有課堂，點「＋安排課程」開始安排。</p></div>`;
  }

  el.innerHTML=`<div class="day-panel-shell">
    <section class="day-panel-section day-panel-main">
      <h3 class="day-panel-title">${S.selectedDate===todayStr?'今日課程':'當日課程'}</h3>
      <div class="day-course-list">${courseHtml}</div>
    </section>
    <section class="day-panel-section day-panel-notes">
      <h3 class="day-panel-title">提醒事項</h3>
      <div id="day-course-memos"></div>
    </section>
    <section class="day-panel-section day-panel-meta">
      <h3 class="day-panel-title">完成狀態</h3>
      <div class="day-panel-stats">
        <div class="day-today-stat"><div class="dts-val">${dayTotal}</div><div class="dts-lbl">課堂</div></div>
        <div class="day-today-stat"><div class="dts-val day-completed-count">${dayDone}</div><div class="dts-lbl">完成</div></div>
        <div class="day-today-stat"><div class="dts-val day-progress-count">${dayRate}%</div><div class="dts-lbl">進度</div></div>
      </div>
    </section>
  </div>`;
  renderDayMemo();
}

const ghost=document.getElementById('drag-ghost');
const ghostDot=document.getElementById('ghost-dot');
const ghostName=document.getElementById('ghost-name');
function dragStart(e,cid){
  S.dragCourseId=cid;
  if(e.dataTransfer){
    e.dataTransfer.effectAllowed='copy';
    e.dataTransfer.setData('text/plain',cid);
    // 隱藏預設 drag image，改用自訂 ghost
    const blank=document.createElement('canvas');
    blank.width=1;blank.height=1;
    document.body.appendChild(blank);
    e.dataTransfer.setDragImage(blank,0,0);
    setTimeout(()=>blank.remove(),0);
  }
  const c=course(cid);if(c){ghostDot.style.background=c.color;ghostName.textContent=c.name;}
  setTimeout(()=>{e.currentTarget.classList.add('dragging');ghost.classList.add('active');},0);
}
function dragEnd(e){e.currentTarget.classList.remove('dragging');ghost.classList.remove('active');S.dragCourseId=null;}
document.addEventListener('dragover',e=>{ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';},{passive:true});
function dragOver(e){
  if(!S.dragCourseId)return;
  e.preventDefault();
  if(e.dataTransfer)e.dataTransfer.dropEffect='copy';
  e.currentTarget.classList.add('drag-over');
}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
function drop(e,date,time=''){
  e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('drag-over');
  const c=course(S.dragCourseId);if(!c||remaining(c)<=0)return;
  addEvent(date,c.id,time);S.selectedDate=date;saveState();render();
  if(useSlideDayPanel())openDayPanel();
  if(isCalendarCourseHidden(c.id))toast(calendarScheduleMessage('已安排一堂課程',c.id),'success');
}

// ── Pointer Events drag：iPad / 平板觸控支援（升級版）──────────────
(function(){
  let _pDragging=false,_pCid=null,_pClone=null;
  let _pStartX=0,_pStartY=0,_pMoved=false;
  let _pOX=0,_pOY=0;
  let _pLastTarget=null;
  let _tx=0,_ty=0,_cx=0,_cy=0;
  let _rafId=null;
  const LERP=0.18;

  function _lerp(a,b,t){return a+(b-a)*t;}

  function _animClone(){
    if(!_pDragging||!_pClone)return;
    _cx=_lerp(_cx,_tx,LERP);
    _cy=_lerp(_cy,_ty,LERP);
    _pClone.style.left=(_cx-_pOX)+'px';
    _pClone.style.top=(_cy-_pOY)+'px';
    ghost.style.left=_cx+'px';
    ghost.style.top=_cy+'px';
    _rafId=requestAnimationFrame(_animClone);
  }

  function _ptStart(e){
    const card=e.target.closest('[draggable="true"]');
    if(!card||e.target.closest("button,input,select,textarea,a")||(isMobile()&&e.pointerType==="touch"))return;
    const cidMatch=card.getAttribute('ondragstart')?.match(/'([^']+)'/);
    if(!cidMatch)return;
    e.preventDefault();
    _pDragging=true;_pCid=cidMatch[1];

    const rect=card.getBoundingClientRect();
    const pt=e.touches?e.touches[0]:e;
    _pOX=pt.clientX-rect.left;_pOY=pt.clientY-rect.top;
    _cx=pt.clientX;_cy=pt.clientY;_tx=pt.clientX;_ty=pt.clientY;
    _pStartX=pt.clientX;_pStartY=pt.clientY;_pMoved=false;
    _pClone=card.cloneNode(true);
    _pClone.style.cssText=`position:fixed;z-index:9998;pointer-events:none;width:${rect.width}px;opacity:.9;border-radius:18px;box-shadow:0 24px 56px rgba(0,0,0,.26),0 8px 20px rgba(0,0,0,.12);transform:scale(1.06);transition:transform 200ms cubic-bezier(0.34,1.56,0.64,1);left:${_cx-_pOX}px;top:${_cy-_pOY}px;`;
    document.body.appendChild(_pClone);
    card.style.opacity='.2';card.style.transform='scale(.96)';card.style.transition='opacity 150ms,transform 150ms';
    const c=course(_pCid);
    if(c){ghostDot.style.background=c.color;ghostName.textContent=c.name;}
    ghost.style.left=_cx+'px';ghost.style.top=_cy+'px';
    ghost.classList.add('active');
    S.dragCourseId=_pCid;
    _rafId=requestAnimationFrame(_animClone);
  }

  function _ptMove(e){
    if(!_pDragging)return;
    e.preventDefault();
    const pt=e.touches?e.touches[0]:e;
    if(!_pMoved){
      if(Math.hypot(pt.clientX-_pStartX,pt.clientY-_pStartY)<8)return;
      _pMoved=true;
      document.getElementById('tablet-overlay').classList.add('is-dragging');
      document.getElementById('panel-l').classList.add('is-dragging');
    }
    _tx=pt.clientX;_ty=pt.clientY;
    const el=document.elementFromPoint(pt.clientX,pt.clientY);
    const cell=el?.closest('.cal-cell:not(.empty),.week-slot:not(.wt-label),.week-slot-unsched');
    if(cell!==_pLastTarget){
      _removePlaceholder(_pLastTarget);
      _pLastTarget?.classList.remove('drag-over');
      if(cell&&S.dragCourseId){cell.classList.add('drag-over');_showPlaceholder(cell,S.dragCourseId);}
      _pLastTarget=cell||null;
    }
  }

  function _ptEnd(e){
    if(!_pDragging)return;
    _pDragging=false;
    if(_rafId){cancelAnimationFrame(_rafId);_rafId=null;}
    const pt=e.changedTouches?e.changedTouches[0]:e;
    if(_pClone){_pClone.remove();_pClone=null;}
    ghost.classList.remove('active');
    document.querySelectorAll('[draggable="true"]').forEach(c=>{c.style.opacity='';c.style.transform='';c.style.transition='';});
    _removePlaceholder(_pLastTarget);
    if(_pLastTarget)_pLastTarget.classList.remove('drag-over');
    const el=document.elementFromPoint(pt.clientX,pt.clientY);
    const cell=el?.closest('.cal-cell:not(.empty)');
    document.getElementById('tablet-overlay').classList.remove('is-dragging');
    document.getElementById('panel-l').classList.remove('is-dragging');
    _pLastTarget=null;
    if(_pMoved&&cell&&S.dragCourseId&&e.type!=='pointercancel'){
      const onclk=cell.getAttribute('onclick')||'';
      const dMatch=onclk.match(/handleCellClick\('([^']+)'\)/);
      if(dMatch){
        if(isTablet())closeTabletPanel();
        dropWithAnimation(cell,dMatch[1],'');
      }
    }
    S.dragCourseId=null;
  }

  function _showPlaceholder(cell,cid){
    if(!cell)return;
    const c=course(cid);if(!c)return;
    cell.querySelectorAll('.drag-placeholder').forEach(p=>p.remove());
    const ph=document.createElement('div');
    ph.className='drag-placeholder';
    ph.style.cssText=`background:${c.color}22;border:1.5px dashed ${c.color}88;border-radius:6px;padding:1px 5px;font-size:10px;font-weight:600;color:${c.color};opacity:0;transform:scale(.85) translateY(2px);transition:opacity 140ms,transform 140ms cubic-bezier(0.34,1.56,0.64,1);margin-top:2px;pointer-events:none;line-height:1.5;`;
    ph.textContent=courseMark(c.name,2);
    cell.querySelector('.cal-tags')?.appendChild(ph);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ph.style.opacity='1';ph.style.transform='scale(1) translateY(0)';}));
  }
  function _removePlaceholder(cell){
    cell?.querySelectorAll('.drag-placeholder').forEach(p=>{
      p.style.opacity='0';p.style.transform='scale(.8)';setTimeout(()=>p.remove(),120);
    });
  }

  document.addEventListener('pointerdown',_ptStart,{passive:false});
  document.addEventListener('pointermove',_ptMove,{passive:false});
  document.addEventListener('pointerup',_ptEnd,{passive:true});
  document.addEventListener('pointercancel',_ptEnd,{passive:true});
})();


// ── Drop with snap + tag fade-in animation ────────────────────────
function dropWithAnimation(cellEl,date,time){
  const c=course(S.dragCourseId);
  if(!c||remaining(c)<=0)return;

  // 格子吸附彈跳：壓下 → 彈回
  cellEl.style.transition='transform 60ms cubic-bezier(0.4,0,1,1)';
  cellEl.style.transform='scale(.93)';
  setTimeout(()=>{
    cellEl.style.transition='transform 380ms cubic-bezier(0.34,1.56,0.64,1)';
    cellEl.style.transform='scale(1)';
    setTimeout(()=>{cellEl.style.transition='';cellEl.style.transform='';},400);
  },60);

  // 寫入資料
  addEvent(date,c.id,time||'');
  S.selectedDate=date;
  saveState();render();
  if(useSlideDayPanel())openDayPanel();
  if(isCalendarCourseHidden(c.id)){
    toast(calendarScheduleMessage('已安排一堂課程',c.id),'success');
    return;
  }

  // 最新 tag 淡入
  requestAnimationFrame(()=>{
    const tags=document.querySelectorAll(
      `.cal-cell[onclick*="${date}"] .cal-tag`
    );
    const last=tags[tags.length-1];
    if(last){
      last.style.opacity='0';
      last.style.transform='translateY(5px) scale(.8)';
      last.style.transition='none';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        last.style.transition='opacity 280ms cubic-bezier(0.22,1,0.36,1),transform 280ms cubic-bezier(0.34,1.56,0.64,1)';
        last.style.opacity='1';
        last.style.transform='translateY(0) scale(1)';
        setTimeout(()=>{last.style.transition='';},300);
      }));
    }
  });
}

// ── Keyboard navigation ───────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Only when not typing in an input
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
  const sel = S.selectedDate || todayStr;
  if (e.key === 'ArrowRight') { e.preventDefault(); selectDate(addDays(sel, 1)); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); selectDate(addDays(sel, -1)); }
  if (e.key === 'ArrowDown')  { e.preventDefault(); selectDate(addDays(sel, 7)); }
  if (e.key === 'ArrowUp')    { e.preventDefault(); selectDate(addDays(sel, -7)); }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.tagName !== 'BUTTON') {
    if(useSlideDayPanel()) openDayPanel();
  }
  if (e.key === 't' || e.key === 'T') jumpToday();
});

// ── Touch swipe to change month/week ─────────────────────────────
(function(){
  let tx=0, ty=0;
  const calBody = () => document.getElementById('cal-body');
  function onTouchStart(e){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }
  function onTouchEnd(e){
    const dx=e.changedTouches[0].clientX-tx;
    const dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)<Math.abs(dy)*1.2||Math.abs(dx)<40)return; // mostly vertical, ignore
    if(dx < -40) navNext();
    if(dx >  40) navPrev();
  }
  document.addEventListener('touchstart', e=>{
    if(e.target.closest('#cal-body'))onTouchStart(e);
  },{passive:true});
  document.addEventListener('touchend', e=>{
    if(e.target.closest('#cal-body'))onTouchEnd(e);
  },{passive:true});
})();
function setView(v){S.view=v;if(v==='week')S.weekStart=weekStartOf(S.selectedDate||todayStr);render();}
function selectDate(s){
  S.selectedDate=s;
  if(S.view==='week')S.weekStart=weekStartOf(s);
  render();
  initDayPanelGesture();
  if(useSlideDayPanel())openDayPanel();
}
// ── Navigation direction tracking ────────────────────────────────
let _calNavDir = 0; // -1=prev, 1=next, 0=jump

function navPrev(){
  _calNavDir = -1;
  if(S.view==='month'){if(--S.month<0){S.month=11;S.year--;}}
  else S.weekStart=addDays(S.weekStart,-7);
  render();
}
function navNext(){
  _calNavDir = 1;
  if(S.view==='month'){if(++S.month>11){S.month=0;S.year++;}}
  else S.weekStart=addDays(S.weekStart,7);
  render();
}
function jumpToday(){
  _calNavDir = 0;
  S.year=today.getFullYear();S.month=today.getMonth();
  S.selectedDate=todayStr;S.weekStart=weekStartOf(todayStr);
  render();
}

// ── 全域錯誤監控 ─────────────────────────────────────────────────
window.onerror=function(msg,src,line,col,err){
  console.error(`[GlobalError] ${msg} | ${src}:${line}:${col}`,err);
  return false;
};
window.onunhandledrejection=function(e){
  console.error('[UnhandledPromise]',e.reason);
};
// ── 登入入口（帶 _fb 就緒防呆）────────────────────────────────────
function doSignIn(){
  if(window._fbInitError){
    toast('Firebase 初始化失敗，請確認設定是否正確','error',4000);
    return;
  }
  if(!window._fb){
    toast('Firebase 尚未載入，請稍後再試','warn');
    return;
  }
  window._fb.signIn();
}

// ── Init ──────────────────────────────────────────────────────────
function init(){

  // ── DOM cache（高頻查詢元素預先快取）────────────────────────────
  window._dom={
    courseList:  ()=>document.getElementById('course-list'),
    todoList:    ()=>document.getElementById('todo-list'),
    calBody:     ()=>document.getElementById('cal-body'),
    calTitle:    ()=>document.getElementById('cal-title'),
    dayLabel:    ()=>document.getElementById('day-label'),
    dayEvents:   ()=>document.getElementById('day-events'),
    memoGrid:    ()=>document.getElementById('memo-grid'),
    memoArea:    ()=>document.getElementById('memo-area'),
    repCourse:   ()=>document.getElementById('rep-course'),
    globalFill:  ()=>document.getElementById('global-fill'),
    globalPct:   ()=>document.getElementById('global-pct'),
    panelR:      ()=>document.getElementById('panel-r'),
    syncDot:     ()=>document.getElementById('sync-dot'),
    syncLabel:   ()=>document.getElementById('sync-label'),
  };
  // Eagerly cache stable elements
  const _d=window._dom;
  Object.keys(_d).forEach(k=>{const el=_d[k]();if(el){_d[k]=()=>el;}});


  // Weekday checkboxes
  const ww=document.getElementById('wday-wrap');
  WDAYS.forEach((w,i)=>{
    const wrap=document.createElement('div');
    wrap.innerHTML=`<input type="checkbox" class="rep-day-cb wday-cb" id="wd${i}" value="${i}" aria-label="星期${w}"><label class="wday-label" for="wd${i}">${w}</label>`;
    ww.appendChild(wrap);
  });

  document.getElementById('cal-course-filter').addEventListener('change',event=>{
    calendarCourseId=event.currentTarget.value;
    renderCalendar();
    if(lastRepeatBatch?.lessons)renderRepeatScheduleResult();
  });
  document.getElementById('rep-start').value=todayStr;

  initQuickInput();

  for(const [field,next] of [['inp-name','inp-total'],['inp-total','inp-ls'],['inp-ls','inp-exam']]){
    document.getElementById(field).addEventListener('keydown',event=>{
      if(event.key==='Enter'&&!event.isComposing){
        event.preventDefault();
        document.getElementById(next).focus();
      }
    });
  }
  for(const field of ['inp-total','inp-ls']){
    document.getElementById(field).addEventListener('input',()=>updateNewCourseRange());
  }
  updateNewCourseRange();

  syncFolds();
  // Keep the initial mobile tab ready when a wider window narrows.
  document.getElementById('panel-l').classList.add('mob-active');

  loadState();

  render();
  refreshWeekProgressClock();
  initDayPanelGesture();
  checkIOSInstall();

  // Auto-open today's panel so user sees today's schedule immediately
  if(useSlideDayPanel() && S.selectedDate===todayStr){
    setTimeout(()=>openDayPanel(), 300);
  }

}

// 等 DOM 確實就緒才執行
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
