/* ═══ StudyOS UI v2 · navigation, folds, density (cross-device) ═══ */
:root{--nav-bg:#fdfcfa;--nav-sel:#dcebe8;}

/* ── Phone floating tab bar (single authoritative block) ── */
@media(max-width:767px){
  :root{--bot-h:calc(84px + env(safe-area-inset-bottom,0px));}
  .app-shell{padding-bottom:var(--bot-h);}
  .layout{height:100%;min-height:0;}
  .panel-l,.panel-r{padding-bottom:28px;}
  .bottom-nav{
    display:flex !important;left:16px;right:16px;top:auto;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    width:auto;max-width:400px;margin:0 auto;height:60px;padding:5px;gap:0;
    border:1px solid var(--border-lt);border-radius:999px;background:var(--nav-bg);
    box-shadow:0 1px 2px rgba(43,42,39,.05),0 6px 20px rgba(43,42,39,.08);
    -webkit-backdrop-filter:none;backdrop-filter:none;filter:none;
    isolation:isolate;--active-tab:0;z-index:20;
  }
  .bottom-nav::before{
    content:'';position:absolute;left:5px;top:5px;bottom:5px;
    width:calc((100% - 10px)/3);border-radius:999px;background:var(--nav-sel);
    pointer-events:none;z-index:0;
    transform:translateX(calc(var(--active-tab)*100%));
    transition:transform 260ms cubic-bezier(.22,1,.36,1);
  }
  .bottom-nav .bn-btn{
    position:relative;z-index:1;flex:1 1 0;min-width:0;min-height:44px;gap:3px;
    border-radius:999px;font-size:11px;line-height:1.1;font-weight:600;letter-spacing:.01em;
    color:var(--text-3);-webkit-tap-highlight-color:transparent;transition:color 160ms ease;transform:none;
  }
  .bottom-nav .bn-btn.active{color:var(--accent-h);font-weight:600;}
  .bottom-nav .bn-icon{display:block;width:22px;height:22px;font-size:0;line-height:0;}
  .bottom-nav .bn-icon svg{display:block;width:22px;height:22px;}
  .bottom-nav .bn-btn:active .bn-icon,.bottom-nav .bn-btn:active .bn-label{opacity:.6;}
  .bottom-nav .bn-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
}
@media(max-width:767px) and (prefers-reduced-motion:reduce){
  .bottom-nav::before,.bottom-nav .bn-btn{transition:none;}
}

/* ── Fold blocks ── */
.fold-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:default;}
.fold-head .section-label{margin:0;}
.fold-head:disabled{opacity:1;color:inherit;}
.fold-card>.fold-head{margin-bottom:10px;}
.fold-chev{display:none;}

/* ── Shared: text hierarchy over boxed cards ── */
@media(width < 1200px){
  .course-planning-form{border:0;border-top:1px solid var(--border-lt);border-radius:0;background:none;padding:14px 0 0;}
  .quick-course-section{border:0;background:var(--accent-tint);border-radius:var(--r);padding:12px 14px;}
  .quick-course-section .section-label{margin-bottom:8px;}
  .day-card,.day-group{background:none;border:0;border-bottom:1px solid var(--border-lt);border-radius:0;padding:10px 0;}
  .day-card:hover,.day-group:hover{box-shadow:none;transform:none;}
}

/* ── Phone ── */
@media(max-width:767px){
  .mobile-page-intro{margin:2px 0 14px;}
  .mobile-page-intro h2{font-size:24px;line-height:1.2;letter-spacing:-.02em;}
  .mobile-page-intro p{font-size:13px;margin-top:4px;color:var(--text-3);}
  .fold-head{min-height:48px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .fold-chev{display:block;flex-shrink:0;width:8px;height:8px;margin:-3px 4px 0 0;border:solid var(--text-3);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s ease;}
  .fold-card.is-open .fold-chev{transform:rotate(-135deg);margin-top:3px;}
  .fold-card:not(.is-open) .fold-body{display:none;}
  .fold-card:not(.is-open)>.fold-head{margin-bottom:0;}
  .course-planning-form{padding-top:4px;}

  /* compact course card: name · meta · progress + actions on one row */
  .course-card{display:grid;grid-template-columns:9px minmax(0,1fr) auto auto auto;column-gap:6px;row-gap:2px;align-items:center;padding:12px 14px;margin-bottom:10px;border:1px solid var(--border-lt);box-shadow:none;}
  .course-card .course-head{display:contents;}
  .course-card .course-head .dot{grid-column:1;grid-row:1;align-self:start;margin-top:7px;}
  .course-card .course-head .course-name{grid-column:2/-1;grid-row:1;font-size:16px;}
  .course-card .lesson-chip{grid-column:2/-1;grid-row:2;justify-self:start;margin:0;}
  .course-card .exam-badge{grid-column:2/-1;grid-row:3;justify-self:start;margin:2px 0;}
  .course-card .course-progress-row{grid-column:1/3;grid-row:4;margin-top:4px;min-width:0;}
  .course-card .course-head>.exam-pen-btn,.course-card .course-head>.del-btn{grid-row:4;margin:4px 0 0;min-height:44px;min-width:44px;}
  .course-card .course-head>.exam-pen-btn:nth-of-type(1){grid-column:3;}
  .course-card .course-head>.exam-pen-btn:nth-of-type(2){grid-column:4;}
  .course-card .course-head>.del-btn{grid-column:5;}

  /* 今日 */
  .panel-r #day-label{font-size:26px;line-height:1.2;margin:0 0 12px;letter-spacing:-.02em;}
  .day-schedule-entry{margin-bottom:12px;}
  #day-schedule-open{width:100%;min-height:48px;font-size:15px;}
  .day-panel-stats{gap:8px;}
  .day-panel-stats .day-today-stat{padding:6px 4px;background:var(--sunken);}

  .day-panel-stats .dts-lbl{font-size:11px;}
  .day-panel-main>.day-panel-title{font-size:15px;margin-bottom:2px;}
}

/* ── Tablet ── */
@media(min-width:768px) and (width < 1200px){
  .panel-l.tablet-open .course-card{border:1px solid var(--border-lt);}
  #day-schedule-open{width:100%;}
  .cal-cell{min-height:72px;}
}

/* ── Desktop: the calendar is the focus ── */
@media(min-width:1200px){
  .layout{grid-template-columns:minmax(20px,1fr) 296px minmax(0,1040px) minmax(20px,1fr);column-gap:24px;}
  .panel-l{width:296px;min-width:296px;max-width:296px;background:transparent;border-color:transparent;box-shadow:none;padding:6px 4px 16px 0;}
  .cal-panel{max-width:1040px;background:var(--surface);border-color:var(--border-lt);box-shadow:var(--shadow-sm);}
  .cal-cell{min-height:96px;border-radius:12px;}
  .course-planning-form,.quick-course-section{padding:12px 0 0;border:0;background:none;}
  .quick-course-section{padding-top:0;}
  .course-planning-form{border-top:1px solid var(--border-lt);}
  .course-planning-form .fold-head{pointer-events:none;}
}

/* StudyOS shared interface. The Header's position and blur are defined above. */
@font-face{
  font-family:"LINE Seed TW";
  src:url("./fonts/LINESeedTW_W_Rg.woff2") format("woff2");
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:"LINE Seed TW";
  src:url("./fonts/LINESeedTW_W_Bd.woff2") format("woff2");
  font-weight:600 900;
  font-display:swap;
}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","LINE Seed TW",sans-serif;
  --text:#262d2a;
  --text-2:#434e48;
  --text-3:#5f6963;
  --bg:#f6f5f1;
  --card-2:#f4f4ef;
  --sunken:#edeee9;
  --sunken-h:#e4e7e1;
  --accent-rgb:52,111,104;
  --accent:#346f68;
  --accent-h:#285d56;
  --accent-tint:#edf5f1;
  --nav-bg:#fdfcf9;
  --nav-sel:#dcece5;
  --r-sm:10px;
  --r:14px;
  --r-lg:18px;
  --r-xl:22px;
  --r-btn:var(--r-pill);
  --shadow-pop:0 10px 34px rgba(32,45,40,.12);
  --ui-control:44px;
  --ui-heading:clamp(1.375rem,2.3vw,1.75rem);
  --ui-label:.875rem;
  --ui-caption:.8125rem;
}
body{font-size:.9375rem;line-height:1.5;letter-spacing:normal;}
.ui-icon{
  width:18px;height:18px;display:inline-block;flex:none;vertical-align:middle;
  fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;
  pointer-events:none;
}
.header-row h1{display:flex;align-items:center;gap:7px;white-space:nowrap;}
.header-row h1 .ui-icon{color:var(--accent-h);}
.header-row .header-actions{gap:6px;}
.header-actions .btn,.header-actions .auth-btn,.signout-btn{font-size:var(--ui-caption);box-shadow:none;}
.btn,.auth-btn,.signout-btn,.course-expand-btn,.cal-nav button,.fab-manage{
  border-radius:var(--r-pill);font-weight:600;
}
.btn:not(.btn-xs){min-height:var(--ui-control);padding:8px 14px;font-size:var(--ui-label);line-height:1.35;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-sand,.act-btn{background:var(--sunken);color:var(--text-2);}
.btn-sand:hover,.act-btn:hover{background:var(--sunken-h);color:var(--text);}
button:not(:disabled){touch-action:manipulation;}
button:active:not(:disabled){filter:brightness(.91);}
.btn:active:not(:disabled){transform:none!important;}
:where(button,[role="button"],input,select,textarea):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
input:is([type=text],[type=number],[type=date]),select:not(.time-sel),textarea,
#quick-input,.schedule-time-trigger{
  min-width:0;max-width:100%;min-height:var(--ui-control);font:inherit;font-size:1rem;
  padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);
}
input[readonly]{background:var(--card-2);color:var(--text-2);}
input:is([type=text],[type=number],[type=date]):focus,select:focus,textarea:focus{box-shadow:none;}
:where(.form-label,#day-schedule-form label,#reschedule-form label,#memo-item-form label){
  color:var(--text-2);font-size:var(--ui-label);font-weight:600;letter-spacing:normal;
}
.section-label,.memo-area-title{
  color:var(--text);font-size:1rem;font-weight:600;letter-spacing:normal;
}
.mobile-page-intro h2,.tablet-course-heading h2,.cal-head .cal-title,#panel-r #day-label{
  color:var(--text);font-weight:600;font-size:var(--ui-heading);line-height:1.25;letter-spacing:-.025em;
}
.mobile-page-intro p{font-size:var(--ui-caption);color:var(--text-3);}
#panel-l .section{margin-bottom:var(--sp-6);}
#panel-l .section-label{font-size:1rem;font-weight:600;color:var(--text);}
#panel-l .course-list-section>.section-label{display:none;}
.course-list-section .muted,.day-empty{color:var(--text-3);font-size:var(--ui-label);}
#course-list{
  background:var(--surface);border:1px solid var(--border-lt);border-radius:var(--r);

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

  signInWithPopup,signInWithRedirect,getRedirectResult,

}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,doc,setDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={
  apiKey:"AIzaSyASGEfoKCQuxhACu_9CEQICKEHSKe2N3MA",

  messagingSenderId:"109854996123",
  appId:"1:109854996123:web:f6937171fb3109d8e6383e"
};

let app,auth,db,provider;

  auth=getAuth(app);
  db=getFirestore(app);
  provider=new GoogleAuthProvider();

let _unsubscribe=null;

// 智能登入：先嘗試 popup，若失敗（popup blocked / mobile）改用 redirect
async function smartSignIn(){
  try{
    await signInWithPopup(auth,provider);
  }catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'){
      console.log('[Firebase] popup blocked, trying redirect...');
      await signInWithRedirect(auth,provider);
    }else{
      const msg={
        'auth/unauthorized-domain':'登入失敗：此網域未授權，請在 Firebase Console 加入 abin4ni.github.io',
        'auth/network-request-failed':'登入失敗：網路錯誤，請檢查連線。',
      }[e.code]||`登入失敗：${e.message}`;
      (window.toast||alert)(msg,'error');

  listenCloud:(uid,cb)=>{

<script>
// ── PWA：Service Worker 註冊 + 版本更新通知 + 離線偵測 ─────────

let _swReg = null;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      _swReg = await navigator.serviceWorker.register('./sw.js');
      console.log('[PWA] SW registered:', _swReg.scope);

      // 監聽 SW 送來的訊息
      navigator.serviceWorker.addEventListener('message', e => {
        const type = e.data?.type;

        // 收到背景同步指令 → 把離線佇列推上 Firebase
        if (type === 'FLUSH_SYNC') {
          console.log('[PWA] FLUSH_SYNC received');
          flushOfflineQueue().then(() => render()); // re-render UI 確保同步
        }

        // 新版 SW 啟動完成 → 提示使用者更新
        if (type === 'SW_UPDATED') {
          console.log('[PWA] New SW activated');
          showUpdateBanner();
        }
      });

      // 偵測有新版 SW 等待中（使用者尚未重整）
      _swReg.addEventListener('updatefound', () => {
        const newWorker = _swReg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // 有新版等待 → 顯示更新橫幅
            console.log('[PWA] New version ready');
            showUpdateBanner();
          }
        });
      });

    } catch (e) {
      console.warn('[PWA] SW registration failed', e);
    }
  });
}

// 版本更新橫幅
function showUpdateBanner(){
  // 避免重複顯示
  if (document.getElementById('update-banner')) return;
  const el = document.createElement('div');
  el.id = 'update-banner';
  el.style.cssText = `
    position:fixed;top:calc(var(--nav-h,52px) + 8px);left:50%;transform:translateX(-50%);
    background:rgba(0,113,227,.94);color:#fff;border-radius:980px;
    padding:8px 18px;font-size:12px;font-weight:600;letter-spacing:-.1px;
    box-shadow:0 4px 16px rgba(0,113,227,.35);z-index:9999;
    display:flex;align-items:center;gap:10px;cursor:pointer;
    white-space:nowrap;
  `;
  el.innerHTML = '🆕 有新版本 <span style="text-decoration:underline;opacity:.85">點此更新</span>';
  el.onclick = () => {
    // 通知 SW 立即接管，然後重整
    if (_swReg?.waiting) _swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
    el.remove();
  };
  document.body.appendChild(el);
  // 30 秒後自動消失
  setTimeout(() => el?.remove(), 30000);
}

// 2. 離線變更佇列 ─────────────────────────────────────────────────
const OQ_KEY = 'course-tracker-offline-queue';
let _isOnline = navigator.onLine;

function getOfflineQueue() {
  try { return JSON.parse(localStorage.getItem(OQ_KEY) || 'null'); } catch { return null; }
}
function setOfflineQueue(payload) {
  // 只保留最新一份（後蓋前，不需要堆疊）
  try { localStorage.setItem(OQ_KEY, JSON.stringify({ payload, ts: Date.now() })); } catch (e) {}
}
function clearOfflineQueue() {
  localStorage.removeItem(OQ_KEY);
}

// 上線時自動把離線期間的修改同步到 Firebase
async function flushOfflineQueue() {
  const q = getOfflineQueue();
  if (!q || !window._fbUser || !window._fb) return;
  console.log('[PWA] Flushing offline queue, ts:', new Date(q.ts).toLocaleTimeString());
  setSyncStatus('syncing');
  try {
    await window._fb.saveToCloud(window._fbUser.uid, q.payload);
    clearOfflineQueue();
    setSyncStatus('synced');
    console.log('[PWA] Offline queue flushed ✓');
  } catch (e) {
    setSyncStatus('error');
    console.error('[PWA] Flush failed', e);
  }
}

function ds(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function weekStartOf(s){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()-dt.getDay());return ds(dt.getFullYear(),dt.getMonth(),dt.getDate());}
function addDays(s,n){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return ds(dt.getFullYear(),dt.getMonth(),dt.getDate());}

// Memoised allEntries — cache keyed by eid counter (faster than join)
let _entriesCache=null;
let _entriesCacheKey='';
function allEntries(cid){
  // Use S.eid as cache key — increments on every addEvent, fast O(1) check
  const ck=S.eid+':'+Object.keys(S.calendar).length;
  if(ck!==_entriesCacheKey){
    _entriesCache={};
    const flat=Object.values(S.calendar);
    for(let i=0;i<flat.length;i++){
      const arr=flat[i];
      for(let j=0;j<arr.length;j++){
        const e=arr[j];
        if(!_entriesCache[e.courseId])_entriesCache[e.courseId]=[];
        _entriesCache[e.courseId].push(e);
      }
    }
    _entriesCacheKey=ck;
  }
  return _entriesCache[cid]||[];
}
function invalidateEntriesCache(){_entriesCacheKey='';}

function remaining(c){return Math.max(0,c.total-allEntries(c.id).length);}
function completed(c){return allEntries(c.id).filter(e=>e.done).length;}
function course(id){return S.courses.find(c=>c.id===id);}

// ── Persistence ───────────────────────────────────────────────────
const LS='course-tracker-v1';
let _syncPaused=false; // prevent echo loop when applying remote data

function statePayload(){
  return{courses:S.courses,calendar:S.calendar,cid:S.cid,eid:S.eid,colorCursor,notes:S.notes};
}
function applyPayload(d){
  if(d.courses)S.courses=d.courses;
  if(d.calendar)S.calendar=d.calendar;
  if(d.cid)S.cid=d.cid;
  if(d.eid)S.eid=d.eid;
  if(d.colorCursor!=null)colorCursor=d.colorCursor;
  if(d.notes)S.notes=d.notes;
  invalidateEntriesCache();
  checkRepeatUndoLessons();
}

function saveState(){
  checkRepeatUndoLessons();
  // 永遠先存本機
  try { localStorage.setItem(LS, JSON.stringify(statePayload())); } catch(e) {}

  if (!window._fbUser || !window._fb || _syncPaused) {
    // 未登入或被暫停：若已登入但離線，存到離線佇列
    if (window._fbUser && !_isOnline) {
      setOfflineQueue(statePayload());
      setSyncStatus('offline');
    }
    return;
  }

  if (!_isOnline) {
    // 登入了但離線：存佇列，等上線再 flush
    setOfflineQueue(statePayload());
    setSyncStatus('offline');
    return;
  }

  // 在線且已登入：直接同步
  setSyncStatus('syncing');
  window._fb.saveToCloud(window._fbUser.uid, statePayload())
    .then(() => {
      clearOfflineQueue(); // 清掉舊的離線佇列
      setSyncStatus('synced');
    })
    .catch(() => {
      // 同步失敗（可能是網路剛斷）：存佇列
      setOfflineQueue(statePayload());
      setSyncStatus('error');
    });
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS);if(!raw)return;
    applyPayload(JSON.parse(raw));
  }catch(e){}
}

      if(S.courses.length)window._fb.saveToCloud(user.uid,statePayload()).catch(()=>setSyncStatus('error'));

function positiveInteger(input){
  const value=input.valueAsNumber;
  return /^[0-9]+$/.test(input.value)&&Number.isSafeInteger(value)&&value>0 ? value : null;
}
function updateNewCourseRange(requireTotal=false){
  const totalInput=document.getElementById('inp-total');
  const startInput=document.getElementById('inp-ls');
  const total=positiveInteger(totalInput);
  const lessonStart=startInput.value===''&&!startInput.validity.badInput ? 1 : positiveInteger(startInput);
  const lessonEnd=total&&lessonStart ? lessonStart+(total-1) : null;
  const invalidTotal=!total&&(requireTotal||totalInput.value!==''||totalInput.validity.badInput);
  const invalidRange=lessonEnd!==null&&!Number.isSafeInteger(lessonEnd);
  let message='';
  if(invalidTotal)message='總堂數須為正整數。';
  else if(!lessonStart)message='起始編號須為正整數，留空時從 1 開始。';
  else if(invalidRange)message='計算後的結束編號過大，請調整總堂數或起始編號。';
  document.getElementById('course-number-message').textContent=message;
  document.getElementById('inp-le').value=lessonEnd!==null&&!invalidRange ? lessonEnd : '';
  totalInput.setAttribute('aria-invalid',String(invalidTotal||invalidRange));
  startInput.setAttribute('aria-invalid',String(!lessonStart||invalidRange));
  if(message||!total)return null;
  return {total,lessonStart,lessonEnd};
}
function addCourse(event){
  event.preventDefault();
  const range=updateNewCourseRange(true);
  if(!range)return;
  const nameInput=document.getElementById('inp-name');
  const name=nameInput.value.trim();
  if(!name){toast('請輸入科目名稱','warn');nameInput.focus();return;}
  const {total,lessonStart,lessonEnd}=range;
  const examDate=document.getElementById('inp-exam').value||'';
  const id=`c${S.cid++}`;
  S.courses.push({id,name,total,color:PALETTE[colorCursor++%PALETTE.length],examDate,lessonStart,lessonEnd});
  event.currentTarget.reset();
  updateNewCourseRange();
  nameInput.focus();
  saveState();render();
  // Mark the last card as new for animation
  requestAnimationFrame(()=>{
    const cards=document.querySelectorAll('#course-list .course-card');
    if(cards.length) cards[cards.length-1].classList.add('new-card');
  });
  toast(`已新增「${name}」（${total} 堂）`,'success');
}
function deleteCourse(id){

  showConfirm(

}

      <button type="button" class="memo-delete" data-memo-action="delete" aria-label="刪除：${esc(item.text)}">刪除</button>
    </li>`).join('')+'</ul>' : '<p class="memo-empty">尚無事項</p>';
  const focused=memoItems.contains(document.activeElement)?document.activeElement:null;

    memoItems.innerHTML=markup;
    if(focused)focusMemoItem(focused.closest('[data-memo-item]').dataset.memoItem,focused.dataset.memoAction);

function openMemoDraft(item){
  memoDraft={id:item?.id,text:item?.text};
  memoMessage.textContent='';
  memoInput.removeAttribute('aria-invalid');
  document.getElementById('memo-item-label').textContent=item?'編輯事項':'新增事項';
  document.getElementById('memo-item-submit').textContent=item?'儲存':'新增';

function saveCourseMemo(items){
  S.notes[memoCourseId]=items;

function submitMemoDraft(event){
  event.preventDefault();
  if(!memoDraft||!course(memoCourseId))return;
  const text=memoInput.value;
  if(!text.trim()){
    memoInput.setAttribute('aria-invalid','true');
    memoMessage.textContent='請輸入事項文字。';
    memoInput.focus();
    return;
  }
  const items=courseMemoItems(memoCourseId);
  const {id, text:originalText}=memoDraft;
  const current=items.find(item=>item.id===id);
  if(id&&current?.text!==originalText){
    memoMessage.textContent='這個事項已在其他地方更新或刪除，請取消後重新選擇。';
    return;
  }
  resetMemoDraft();
  if(!id){
    const itemId=Array.from(crypto.getRandomValues(new Uint32Array(4)),part=>part.toString(16).padStart(8,'0')).join('');
    saveCourseMemo([...items,{id:itemId,text,done:false}]);
    memoAdd.focus();
    return;
  }
  if(text!==originalText)saveCourseMemo(items.map(item=>item.id===id?{...item,text}:item));
  focusMemoItem(id,'edit');
}

// ── Repeat Schedule ───────────────────────────────────────────────
let lastRepeatBatch=null;
let repeatPreview=null;
const repeatForm=document.getElementById('repeat-schedule-form');
const repeatDialog=document.getElementById('repeat-preview');
const repeatConfirm=document.getElementById('repeat-preview-confirm');
function readRepeatPlan(form){
  return {
    courseId:form.elements['rep-course'].value,
    days:[...form.querySelectorAll('.rep-day-cb:checked')].map(cb=>Number(cb.value)),
    perDay:positiveInteger(form.elements['rep-per-day']),
    start:form.elements['rep-start'].valueAsNumber,
    end:form.elements['rep-end'].valueAsNumber
  };
}
function showRepeatScheduleError(message){
  document.getElementById('repeat-schedule-error').textContent=message;
}
function updateRepeatScheduleForm(form){
  form.elements['rep-submit'].disabled=JSON.stringify(readRepeatPlan(form))===lastRepeatBatch?.key;
}
function renderRepeatScheduleResult(){
  const result=document.getElementById('repeat-schedule-result');
  const status=document.getElementById('repeat-schedule-message');
  const batch=lastRepeatBatch;
  result.hidden=!batch;
  status.textContent=batch ? (batch.lessons?calendarScheduleMessage(batch.message,batch.courseId):batch.message) : '';
  document.getElementById('repeat-undo').hidden=!batch?.lessons;
}
function matchesRepeatLesson(lesson,original){
  return original&&lesson.courseId===original.courseId&&lesson.time===original.time&&lesson.done===original.done;
}
function checkRepeatUndoLessons(){
  const recorded=lastRepeatBatch?.lessons;
  if(!recorded)return;
  // Once a change has been observed, that lesson is no longer eligible for undo.
  for(const [date,originals] of recorded){
    const unchanged=new Set();
    for(const lesson of S.calendar[date]||[]){
      if(!originals.has(lesson.id))continue;
      if(unchanged.has(lesson.id)||!matchesRepeatLesson(lesson,originals.get(lesson.id))){
        originals.delete(lesson.id);
      }else unchanged.add(lesson.id);
    }
    for(const id of originals.keys()){
      if(!unchanged.has(id))originals.delete(id);
    }
    if(!originals.size)recorded.delete(date);
  }
}
function undoRepeatSchedule(){
  if(!lastRepeatBatch?.lessons)return;
  checkRepeatUndoLessons();
  const {lessons,count}=lastRepeatBatch;
  lastRepeatBatch=null;
  let removed=0;
  for(const [date,originals] of lessons){
    const remainingLessons=S.calendar[date].filter(lesson=>!matchesRepeatLesson(lesson,originals.get(lesson.id)));
    removed+=S.calendar[date].length-remainingLessons.length;
    if(remainingLessons.length)S.calendar[date]=remainingLessons;
    else delete S.calendar[date];
  }
  lastRepeatBatch={message:'已復原 '+removed+' 堂，略過 '+(count-removed)+' 堂'};
  if(removed){
    invalidateEntriesCache();
    saveState();render();
  }
  updateRepeatScheduleForm(repeatForm);
  renderRepeatScheduleResult();
  document.getElementById('repeat-schedule-message').focus();
}
function calculateRepeatBatch({courseId,days,perDay,start,end}){
  const selectedCourse=course(courseId);
  if(!selectedCourse)return {error:'請先選擇科目。'};
  if(!days.length)return {error:'請選擇至少一個上課日。'};
  if(!perDay)return {error:'每個上課日的堂數須為正整數。'};
  if(!Number.isFinite(start)||!Number.isFinite(end)){
    return {error:'請填寫有效的排課開始日期與結束日期。'};
  }
  if(end<start)return {error:'排課結束日期不得早於開始日期。'};

  const available=Math.floor(remaining(selectedCourse));
  const dates=[];
  let added=0;
  // Date inputs provide UTC midnight, so weekday steps are stable across time zones and DST.
  for(let timestamp=start;timestamp<=end&&added<available;timestamp+=86400000){
    const date=new Date(timestamp);
    if(!days.includes(date.getUTCDay()))continue;
    const year=String(date.getUTCFullYear()).padStart(4,'0');
    const count=Math.min(perDay,available-added);
    dates.push({date:ds(year,date.getUTCMonth(),date.getUTCDate()),count});
    added+=count;
  }
  const reason=!available ? '這門課程已無未排堂次。' :
    !added ? '這段期間沒有符合所選星期的上課日。' : '';
  return {name:selectedCourse.name,available,dates,added,remaining:available-added,reason};
}
function repeatBatchSummary(batch){
  return '本次安排 '+batch.added+' 堂，剩餘 '+batch.remaining+' 堂未排';
}
function renderRepeatPreview(batch,notice=''){
  document.getElementById('repeat-preview-notice').textContent=notice;
  document.getElementById('repeat-preview-course').textContent=batch.name||'';
  document.getElementById('repeat-preview-summary').textContent=batch.error||
    repeatBatchSummary(batch)+(batch.reason?'。'+batch.reason:'');
  document.getElementById('repeat-preview-dates').innerHTML=(batch.dates||[]).map(({date,count})=>
    '<li><time datetime="'+date+'">'+date+'</time><span>新增 '+count+' 堂</span></li>'
  ).join('');
  document.getElementById('repeat-preview-body').scrollTop=0;
  repeatConfirm.disabled=!batch.added;
}
function openRepeatPreview(event){
  event.preventDefault();
  const plan=readRepeatPlan(repeatForm);
  const key=JSON.stringify(plan);
  if(key===lastRepeatBatch?.key||repeatDialog.open)return;
  const batch=calculateRepeatBatch(plan);
  if(batch.error){showRepeatScheduleError(batch.error);return;}
  showRepeatScheduleError('');
  repeatPreview={key,courseId:plan.courseId,batch};
  renderRepeatPreview(batch);
  repeatDialog.showModal();
}
function closeRepeatPreview(){
  repeatPreview=null;
  repeatDialog.close();
}
function confirmRepeatSchedule(event){
  if(!repeatPreview||!repeatDialog.open||repeatConfirm.disabled)return;
  // A rapid second tap on a refreshed preview must not commit the changed batch.
  if(event.detail>1||(event.detail>0&&performance.now()<repeatPreview.pointerConfirmAfter))return;
  const plan=readRepeatPlan(repeatForm);
  const key=JSON.stringify(plan);
  if(key===lastRepeatBatch?.key){closeRepeatPreview();return;}
  if(!plan.courseId&&!course(repeatPreview.courseId)){
    renderRepeatPreview({name:repeatPreview.batch.name,error:'原先選取的科目已不存在。'},'排課結果已更新。');
    document.getElementById('repeat-preview-cancel').focus();
    return;
  }
  if(key!==repeatPreview.key){
    closeRepeatPreview();
    showRepeatScheduleError('排課條件已變更，請重新預覽。');
    return;
  }
  const batch=calculateRepeatBatch(plan);
  if(JSON.stringify(batch)!==JSON.stringify(repeatPreview.batch)){
    repeatPreview={key,courseId:plan.courseId,batch,pointerConfirmAfter:performance.now()+400};
    renderRepeatPreview(batch,batch.added?'排課結果已更新，請重新確認。':'排課結果已更新。');
    document.getElementById('repeat-preview-body').focus();
    return;
  }

  repeatConfirm.disabled=true;
  const lessons=new Map();
  lastRepeatBatch={key,message:repeatBatchSummary(batch),courseId:plan.courseId,lessons,count:batch.added};
  repeatForm.elements['rep-submit'].disabled=true;
  closeRepeatPreview();
  for(const {date,count} of batch.dates){
    const originals=new Map();
    for(let i=0;i<count;i++){
      const lesson=addEvent(date,plan.courseId);
      originals.set(lesson.id,{...lesson});
    }
    lessons.set(date,originals);
  }
  saveState();render();
  updateRepeatScheduleForm(repeatForm);
  renderRepeatScheduleResult();
  document.getElementById('repeat-undo').focus();
}
function updateRepeatConditions(){
  const wasPreviewing=!!repeatPreview;
  if(wasPreviewing)closeRepeatPreview();
  updateRepeatScheduleForm(repeatForm);
  showRepeatScheduleError(wasPreviewing?'排課條件已變更，請重新預覽。':'');
}
repeatForm.addEventListener('input',updateRepeatConditions);
repeatForm.addEventListener('change',()=>{
  if(repeatPreview)updateRepeatConditions();
});
repeatDialog.addEventListener('keydown',event=>event.stopPropagation());
repeatConfirm.addEventListener('click',confirmRepeatSchedule);
document.getElementById('repeat-undo').addEventListener('click',undoRepeatSchedule);
document.getElementById('repeat-preview-cancel').addEventListener('click',closeRepeatPreview);
repeatDialog.addEventListener('cancel',event=>{
  event.preventDefault();
  closeRepeatPreview();
});

function examBadge(c){

// ── Tablet panel toggle ───────────────────────────────────────────
function isTablet(){return window.innerWidth>=768&&window.innerWidth<1200;}
function isMobile(){return window.innerWidth<=767;}
function useSlideDayPanel(){return window.innerWidth>=1200;}
let _panelTouchStartX=0;
let _panelTouchStartY=0;
let _panelTouchDeltaX=0;
function _resetDayPanelGestureStyles(){
  const panel=document.getElementById('panel-r');
  if(!panel)return;
  panel.style.removeProperty('transform');
  panel.style.removeProperty('transition');
}
let dayPanelReturnFocus=null;
function openDayPanel(){
  if(!useSlideDayPanel())return;
  const panel=document.getElementById('panel-r');
  const overlay=document.getElementById('day-panel-overlay');
  _resetDayPanelGestureStyles();
  panel?.classList.add('open');
  overlay?.classList.add('open');
}
function closeDayPanel(){
  cancelDaySchedule();
  _resetDayPanelGestureStyles();
  document.getElementById('panel-r')?.classList.remove('open');
  document.getElementById('day-panel-overlay')?.classList.remove('open');
  if(dayPanelReturnFocus){
    dayPanelReturnFocus();
    dayPanelReturnFocus=null;
  }
}
function initDayPanelGesture(){
  const panel=document.getElementById('panel-r');
  if(!panel||panel.dataset.gestureReady==='1')return;
  panel.dataset.gestureReady='1';
  panel.addEventListener('touchstart',e=>{
    if(!panel.classList.contains('open')||!useSlideDayPanel())return;
    const t=e.touches&&e.touches[0];if(!t)return;
    _panelTouchStartX=t.clientX;_panelTouchStartY=t.clientY;_panelTouchDeltaX=0;
  },{passive:true});
  panel.addEventListener('touchmove',e=>{
    if(!_panelTouchStartX||!panel.classList.contains('open')||!useSlideDayPanel())return;
    const t=e.touches&&e.touches[0];if(!t)return;
    const dx=t.clientX-_panelTouchStartX;
    const dy=Math.abs(t.clientY-_panelTouchStartY);
    if(dx>0&&dy<36){
      _panelTouchDeltaX=Math.min(dx,160);
      panel.style.transition='none';
      panel.style.transform=`translateX(${_panelTouchDeltaX}px)`;
    }
  },{passive:true});
  const onGestureEnd=()=>{
    if(!_panelTouchStartX)return;
    const shouldClose=_panelTouchDeltaX>88;
    _panelTouchStartX=0;_panelTouchStartY=0;_panelTouchDeltaX=0;
    panel.style.transition='transform .3s cubic-bezier(0.22,1,0.36,1),opacity .3s cubic-bezier(0.22,1,0.36,1)';
    if(shouldClose){
      closeDayPanel();
    }else if(panel.classList.contains('open')){
      panel.style.transform='translateX(0)';
      setTimeout(()=>_resetDayPanelGestureStyles(),320);
    }else{
      _resetDayPanelGestureStyles();
    }
  };
  panel.addEventListener('touchend',onGestureEnd,{passive:true});
  panel.addEventListener('touchcancel',onGestureEnd,{passive:true});
}
function toggleTabletPanel(){
  const panel=document.getElementById('panel-l');
  const overlay=document.getElementById('tablet-overlay');
  const fab=document.getElementById('fab-manage');
  const isOpen=panel.classList.contains('tablet-open');
  if(isOpen){
    panel.classList.remove('tablet-open');
    overlay.classList.remove('open');
    if(fab)fab.setAttribute('aria-expanded','false');
  }else{
    panel.classList.add('tablet-open');
    overlay.classList.add('open');
    if(fab)fab.setAttribute('aria-expanded','true');
  }
}
function closeTabletPanel(){
  document.getElementById('panel-l')?.classList.remove('tablet-open');
  document.getElementById('tablet-overlay')?.classList.remove('open');
  const fab=document.getElementById('fab-manage');

}

function mobileTab(tab){
  if(!isMobile())return;
  if(tab!=='cal')cancelCalendarSchedule();

  document.getElementById('panel-l').classList.toggle('mob-active',tab==='course');
  document.getElementById('panel-cal').classList.toggle('mob-active',tab==='cal');
  const pr=document.getElementById('panel-r');

  pr.classList.remove('mob-visible');
  ['bn-course','bn-cal','bn-day'].forEach(id=>document.getElementById(id)?.classList.remove('active'));

  ['course','cal','day'].forEach(name=>{
    const button=document.getElementById('bn-'+name);

// ── IntersectionObserver stagger entrance ─────────────────────────
let _staggerObs=null;
function initStaggerObserver(){
  if(_staggerObs)_staggerObs.disconnect();
  _staggerObs=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting)return;
      const el=entry.target;
      if(el.dataset.staggerDone)return;
      el.dataset.staggerDone='1';
      el.style.opacity='0';
      el.style.transform='translateY(10px) scale(.97)';
      el.style.transition='none';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        const d=parseInt(el.dataset.staggerIdx||0)*40;
        el.style.transition=`opacity 280ms ${d}ms var(--ease-ios),transform 280ms ${d}ms var(--ease-ios)`;
        el.style.opacity='1';
        el.style.transform='translateY(0) scale(1)';
      }));
      _staggerObs.unobserve(el);
    });
  },{threshold:0.08});
  document.querySelectorAll('.course-card,.todo-card').forEach((el,i)=>{
    if(!el.dataset.staggerDone){el.dataset.staggerIdx=i;_staggerObs.observe(el);}
  });
}

function render(){
  renderHeader();renderCourses();renderRepeatSelect();renderTodo();renderCalendar();renderDayPanel();renderMemo();
  requestAnimationFrame(initStaggerObserver);
}

// Keep emoji and combined characters intact in compact calendar labels.
const courseNameSegments=typeof Intl.Segmenter==='function'?new Intl.Segmenter():null;
function courseMark(name,count){
  const letters=courseNameSegments ? Array.from(courseNameSegments.segment(name),part=>part.segment) : Array.from(name);
  return letters.slice(0,count).join('');
}

// ── Month View ────────────────────────────────────────────────────
function renderMonthView(){
  const{year:y,month:m}=S;
  document.getElementById('cal-title').textContent=`${y} 年 ${MONTHS[m]}`;
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let html=WDAYS.map(l=>`<div class="cal-lbl">${l}</div>`).join('');
  for(let i=0;i<first;i++)html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const s=ds(y,m,d),evts=calendarLessonsForDate(s);
    const isTap=!!S.tapCourseId;
    // empty-day = has no events and is not in the past for quick-add hint
    const isEmpty=!S.calendar[s]?.length;
    const cls=['cal-cell',
      s===todayStr?'today':'',
      s===S.selectedDate?'selected':'',
      isTap?'tap-target-ready':'',
      isEmpty&&!isTap?'empty-day':''
    ].filter(Boolean).join(' ');
    const tags=evts.slice(0,3).map(ev=>{
      const c=course(ev.courseId);if(!c)return'';
      const timeStr=ev.time?`<span class="cal-tag-time">${ev.time.slice(0,5)}</span>`:'';
      return`<div class="cal-tag${ev.done?' is-done':''}" style="background:${c.color}18">
        <span class="cal-tag-dot" style="background:${ev.done?'#b0aea5':c.color}"></span>
        <span class="cal-tag-name" title="${esc(c.name)}">${esc(courseMark(c.name,2))}</span>
        ${timeStr}
      </div>`;
    }).join('');
    const more=evts.length>3?`<div class="cal-overflow">+${evts.length-3}</div>`:'';
    html+=`<div class="${cls}" role="button" tabindex="0" data-calendar-date="${s}" aria-label="${s}，${evts.length} 堂課" aria-pressed="${s===S.selectedDate}" ${s===todayStr?'aria-current="date"':''} onclick="handleCellClick('${s}')" onkeydown="activateCalendarDate(event,'${s}')"
         ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${s}')">
      <div class="date-num">${d}</div>
      <div class="cal-tags">${tags}${more}</div>
    </div>`;
  }
  // Apply slide animation class
  const slideClass=_calNavDir===1?'slide-next':_calNavDir===-1?'slide-prev':'';
  const grid=`<div class="cal-grid${slideClass?' '+slideClass:''}">${html}</div>`;
  document.getElementById('cal-body').innerHTML=grid;
  _calNavDir=0; // reset after render
}

function renderWeekView(){

  let unHtml=`<div class="unsched-lbl">未定時</div>`;

    unHtml+=`<div class="${cls}" onclick="handleCellClick('${s}')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${s}','')">${evts.map(ev=>wkEv(ev,s)).join('')}</div>`;

  let rowsHtml='';
  HOURS.forEach(h=>{
    const t=String(h).padStart(2,'0')+':00';

      const evts=lessonsByDay[i].filter(e=>e.time&&parseInt(e.time)===h);

      rowsHtml+=`<div class="${cls}" onclick="handleCellClick('${s}')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${s}','${t}')">${evts.map(ev=>wkEv(ev,s)).join('')}</div>`;
    });
  });
  const body=document.getElementById('cal-body');
  body.innerHTML=`<div class="week-wrap"><div class="week-col-head" style="display:grid;grid-template-columns:${col};">${headHtml}</div><div class="week-scroll"><div class="week-unsched-row" style="grid-template-columns:${col};">${unHtml}</div><div class="week-hour-grid" style="display:grid;grid-template-columns:${col};">${rowsHtml}</div></div></div>`;
  setTimeout(()=>{const sc=body.querySelector('.week-scroll');if(sc)sc.scrollTop=48;},30);
}

function wkEv(ev,date){

// Weekly progress reads the full schedule and uses the device's local date.
const weekProgressSummary=document.getElementById('week-progress-summary');
const weekProgressList=document.getElementById('week-progress-list');
let weekProgressRows='';
let weekProgressRollover;

function renderWeekProgress(){
  const now=new Date();
  const localToday=ds(now.getFullYear(),now.getMonth(),now.getDate());
  const monday=addDays(localToday,-((now.getDay()+6)%7));
  const sunday=addDays(monday,6);
  const dateLabel=(date,includeYear)=>{
    const [year,month,day]=date.split('-').map(Number);
    return (includeYear?year+'/':'')+month+'/'+day;
  };
  let scheduled=0, completed=0, overdue=0;
  const pending=[];
  for(let offset=0;offset<7;offset++){
    const date=addDays(monday,offset);
    for(const lesson of S.calendar[date]||[]){
      scheduled++;
      if(lesson.done){completed++;continue;}
      const late=date<localToday;
      if(late)overdue++;
      pending.push({date,time:lesson.time||'',name:course(lesson.courseId)?.name||'未知課程',late});
    }
  }
  pending.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'24:00').localeCompare(b.time||'24:00'));
  document.getElementById('week-progress-range').textContent=
    dateLabel(monday,true)+'–'+dateLabel(sunday,monday.slice(0,4)!==sunday.slice(0,4));
  document.getElementById('week-progress-count').textContent=completed+'／'+scheduled+' 堂';
  document.getElementById('week-progress-overdue').textContent=overdue+' 堂';
  document.getElementById('week-progress-overdue-label').classList.toggle('is-overdue',overdue>0);
  const empty=document.getElementById('week-progress-empty');
  empty.hidden=pending.length>0;
  empty.textContent=scheduled?'本週已排課堂皆已完成。':'本週尚無已排課堂。';
  const rows=pending.map(({date,time,name,late})=>{
    const [,month,day]=date.split('-').map(Number);
    return `<li><button type="button" class="week-progress-item" data-week-date="${date}">
      <span class="week-progress-name">${esc(name)}</span>
      <span class="week-progress-when">${month}/${day} · ${esc(time||'未定時間')} </span>
      ${late?'<span class="week-progress-late">已過期</span>':''}
    </button></li>`;
  }).join('');
  if(rows!==weekProgressRows){
    if(weekProgressList.contains(document.activeElement))weekProgressSummary.focus({preventScroll:true});
    weekProgressList.innerHTML=rows;
    weekProgressRows=rows;
  }
}

function refreshWeekProgressClock(){
  clearTimeout(weekProgressRollover);
  renderWeekProgress();
  const nextDay=new Date();
  nextDay.setHours(24,0,0,0);
  weekProgressRollover=setTimeout(refreshWeekProgressClock,Math.max(0,nextDay.getTime()-Date.now())+50);
}

weekProgressList.addEventListener('click',event=>{
  const row=event.target.closest('[data-week-date]');
  if(!row)return;
  // Use the date-detail path directly, even if tap-to-schedule mode is active.
  selectDate(row.dataset.weekDate);

    dayPanelReturnFocus=()=>weekProgressSummary.focus({preventScroll:true});

  }else{
    document.getElementById('day-schedule-open').focus({preventScroll:true});
  }
});
document.addEventListener('visibilitychange',()=>{

});
